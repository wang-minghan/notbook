<path fill="#FFF7DF" stroke="#E8D39A" d="M142,620 H1138 A22,22 0 0 1 1160,642 V642 A22,22 0 0 1 1138,664 H142 A22,22 0 0 1 120,642 V642 A22,22 0 0 1 142,620 Z" /><text x="640" y="648" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="15" font-weight="700" fill="#805B12">变更不是“改一处文字”：必须评估影响、冻结版本、回收旧版，再验证关闭</text>
