<defs>
 <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2F6BFF"/></marker>
 <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D95C5C"/></marker>
 <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1C9C8C"/></marker>
 <style>text{font-family:'Microsoft YaHei','Arial',sans-serif;fill:#1F2D3D}.title{font-size:30px;font-weight:700}.sub{font-size:14px;fill:#526173}.label{font-size:13px;font-weight:700}.small{font-size:12px}.tiny{font-size:11px}</style>
</defs><rect width="1280" height="720" fill="#F7F9FC"/>
<text x="52" y="48" class="title">18｜客诉与纠正措施</text><text x="52" y="75" class="sub">从客户入口到临时遏制、根因、纠正、验证和回复的闭环</text>
<text x="52" y="116" class="small" fill="#526173">客户问题统一入口；内部处置与对外回复分开，验证有效后才关闭</text><rect x="58" y="245" width="180" height="116" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="148.0" y="287" text-anchor="middle" class="label">01 接收分级</text><text x="148.0" y="320" text-anchor="middle" class="tiny" fill="#526173">入口｜影响判定</text><line x1="238" y1="303" x2="255" y2="303" stroke="#2F6BFF" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="260" y="245" width="180" height="116" rx="10" fill="#FFFFFF" stroke="#D95C5C" stroke-width="3"/><text x="350.0" y="287" text-anchor="middle" class="label">02 临时措施</text><text x="350.0" y="320" text-anchor="middle" class="tiny" fill="#526173">隔离｜遏制风险</text><line x1="440" y1="303" x2="457" y2="303" stroke="#D95C5C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="462" y="245" width="180" height="116" rx="10" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="552.0" y="287" text-anchor="middle" class="label">03 原因分析</text><text x="552.0" y="320" text-anchor="middle" class="tiny" fill="#526173">事实｜根因｜证据</text><line x1="642" y1="303" x2="659" y2="303" stroke="#7657B8" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="664" y="245" width="180" height="116" rx="10" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="754.0" y="287" text-anchor="middle" class="label">04 纠正措施</text><text x="754.0" y="320" text-anchor="middle" class="tiny" fill="#526173">责任｜期限｜记录</text><line x1="844" y1="303" x2="861" y2="303" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="866" y="245" width="180" height="116" rx="10" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="956.0" y="287" text-anchor="middle" class="label">05 效果验证</text><text x="956.0" y="320" text-anchor="middle" class="tiny" fill="#526173">有效性｜复发控制</text><line x1="1046" y1="303" x2="1063" y2="303" stroke="#1C9C8C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="1068" y="245" width="180" height="116" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="1158.0" y="287" text-anchor="middle" class="label">06 客户回复</text><text x="1158.0" y="320" text-anchor="middle" class="tiny" fill="#526173">结论｜关闭证据</text><path d="M1110 430 C1030 560,520 585,360 430" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/><text x="735" y="585" text-anchor="middle" class="small" fill="#D95C5C">未验证或重复发生：回到原因分析 / 纠正措施</text><rect x="100" y="150" width="1080" height="48" rx="8" fill="#EAF7F4" stroke="#A8DCD4"/><text x="640" y="180" text-anchor="middle" class="label" fill="#1C9C8C">对外回复必须引用：事实、处置结论、验证证据和后续防复发安排</text>
<line x1="52" y1="680" x2="1228" y2="680" stroke="#D7E0EA"/><text x="52" y="704" class="tiny" fill="#526173">鑫犇电子｜治理体系草案｜图形原型，待正式流程/授权文件确认</text><text x="1190" y="704" class="tiny" fill="#526173">DRAFT</text></svg>