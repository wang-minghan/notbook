<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2F6BFF" stroke="none" stroke-width="1" opacity="1"/><text x="60" y="68" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1C9C8C" text-anchor="start" opacity="1">02 / GOVERNANCE</text><text x="60" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="40" font-weight="bold" fill="#1F2D3D" text-anchor="start" opacity="1">这不是“部门介绍”</text><text x="60" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="normal" fill="#526173" text-anchor="start" opacity="1">治理的核心，是把承诺变成可验证的责任、流程和证据</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA" stroke-width="1"/><rect x="90" y="230" width="1100" height="250" rx="14" fill="#EEF3F8" stroke="#D7E0EA" stroke-width="1" opacity="1"/><text x="130" y="305" font-family="Microsoft YaHei,Arial,sans-serif" font-size="88" font-weight="bold" fill="#E27A21" text-anchor="start" opacity="1">“</text><text x="210" y="325" font-family="Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="bold" fill="#1F2D3D" text-anchor="start" opacity="1">客户关心的不是组织名称，而是：谁负责、如何决策、出了问题如何闭环。</text><text x="210" y="390" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="normal" fill="#1C9C8C" text-anchor="start" opacity="1">把管理方法变成客户可以验证的合作能力。</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="normal" fill="#8190A0" text-anchor="start" opacity="1">鑫犇电子有限公司｜公司治理与管理方法</text><text x="1220" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="normal" fill="#8190A0" text-anchor="end" opacity="1">02</text></svg>