<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/><text x="60" y="68" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1C9C8C">18 / GOVERNANCE</text><text x="60" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="40" font-weight="bold" fill="#1F2D3D">客诉与纠正措施</text><text x="60" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#526173">客户问题统一入口，处理、验证和回复形成闭环</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/><path d="M220 340 C220 245 430 215 640 215 C850 215 1060 245 1060 340 C1060 435 850 465 640 465 C430 465 220 435 220 340" fill="none" stroke="#D7E0EA" stroke-width="3"/><g id="main-content" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><rect x="100" y="292" width="190" height="96" rx="16" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="195" y="330" font-size="18" font-weight="bold" fill="#2F6BFF">01 接收分级</text><text x="195" y="358" font-size="14" fill="#526173">入口｜影响判定</text><rect x="355" y="185" width="190" height="96" rx="16" fill="#FFFFFF" stroke="#D95C5C" stroke-width="3"/><text x="450" y="223" font-size="18" font-weight="bold" fill="#B84747">02 临时措施</text><text x="450" y="251" font-size="14" fill="#526173">隔离｜遏制风险</text><rect x="690" y="185" width="190" height="96" rx="16" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="785" y="223" font-size="18" font-weight="bold" fill="#7657B8">03 原因分析</text><text x="785" y="251" font-size="14" fill="#526173">事实｜根因｜证据</text><rect x="930" y="292" width="190" height="96" rx="16" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="1025" y="330" font-size="18" font-weight="bold" fill="#C56A25">04 纠正措施</text><text x="1025" y="358" font-size="14" fill="#526173">责任｜期限｜记录</text><rect x="690" y="420" width="190" height="96" rx="16" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="785" y="458" font-size="18" font-weight="bold" fill="#1C9C8C">05 效果验证</text><text x="785" y="486" font-size="14" fill="#526173">有效性｜复发控制</text><rect x="355" y="420" width="190" height="96" rx="16" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="450" y="458" font-size="18" font-weight="bold" fill="#1C9C8C">06 客户回复</text><text x="450" y="486" font-size="14" fill="#526173">结论｜关闭证据</text></g><path d="M545 468 L690 468" stroke="#1C9C8C" stroke-width="4" marker-end="url(#a)"/><path d="M355 468 C260 468 220 420 220 388" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#r)"/><text x="90" y="585" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#B84747">未验证或重复发生：回到原因分析/纠正措施，不直接关闭</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">鑫犇电子有限公司｜公司治理与管理方法</text><text x="1220" y="690" text-anchor="end" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">18</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1C9C8C"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D95C5C"/></marker></defs></svg>