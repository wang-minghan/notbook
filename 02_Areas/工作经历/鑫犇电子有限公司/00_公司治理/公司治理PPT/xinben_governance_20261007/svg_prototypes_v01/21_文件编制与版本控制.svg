<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
 <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2F6BFF"/></marker>
 <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D95C5C"/></marker>
 <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1C9C8C"/></marker>
 <style>text{font-family:'Microsoft YaHei','Arial',sans-serif;fill:#1F2D3D}.title{font-size:30px;font-weight:700}.sub{font-size:14px;fill:#526173}.label{font-size:13px;font-weight:700}.small{font-size:12px}.tiny{font-size:11px}</style>
</defs><rect width="1280" height="720" fill="#F7F9FC"/>
<text x="52" y="48" class="title">21｜文件编制与版本控制</text><text x="52" y="75" class="sub">让新版本可追溯、可批准、可培训，旧版本可隔离和回收</text>
<text x="52" y="116" class="small" fill="#526173">主环表示受控文件生命周期；红色分支表示旧版隔离、回收和作废</text><rect x="65" y="245" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="160.0" y="287" text-anchor="middle" class="label">起草</text><text x="160.0" y="319" text-anchor="middle" class="small" fill="#526173">需求｜版本号</text><line x1="255" y1="300" x2="285" y2="300" stroke="#2F6BFF" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="293" y="245" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="388.0" y="287" text-anchor="middle" class="label">评审</text><text x="388.0" y="319" text-anchor="middle" class="small" fill="#526173">专业意见</text><line x1="483" y1="300" x2="513" y2="300" stroke="#7657B8" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="521" y="245" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="616.0" y="287" text-anchor="middle" class="label">批准发布</text><text x="616.0" y="319" text-anchor="middle" class="small" fill="#526173">受控清单</text><line x1="711" y1="300" x2="741" y2="300" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="749" y="245" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="844.0" y="287" text-anchor="middle" class="label">执行与培训</text><text x="844.0" y="319" text-anchor="middle" class="small" fill="#526173">使用记录</text><line x1="939" y1="300" x2="969" y2="300" stroke="#1C9C8C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="977" y="245" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="1072.0" y="287" text-anchor="middle" class="label">复审/修订</text><text x="1072.0" y="319" text-anchor="middle" class="small" fill="#526173">触发新版本</text><path d="M825 365 C820 500,600 540,350 490" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/><text x="590" y="535" class="small" text-anchor="middle" fill="#D95C5C">旧版本：隔离、回收、标识、留痕，不回流主流程</text><rect x="100" y="150" width="1080" height="48" rx="8" fill="#EAF7F4" stroke="#A8DCD4"/><text x="640" y="180" text-anchor="middle" class="label" fill="#1C9C8C">证据：版本清单｜审批记录｜发布通知｜培训记录｜旧版回收记录</text>
<line x1="52" y1="680" x2="1228" y2="680" stroke="#D7E0EA"/><text x="52" y="704" class="tiny" fill="#526173">鑫犇电子｜治理体系草案｜图形原型，待正式流程/授权文件确认</text><text x="1190" y="704" class="tiny" fill="#526173">DRAFT</text></svg>