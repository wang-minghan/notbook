              - paragraph [ref=f40e204]
              - paragraph [ref=f40e205]
              - paragraph [ref=f40e206]: 运行动作需要前置工作如下：
              - paragraph [ref=f40e207]: 1）先打开微信读书网站，并用微信扫码登录
              - paragraph [ref=f40e208]: 2） 浏览器前台窗口最大化，再打开开发人员工具（ F12按键 或 Ctrl+Shift+I ）
              - paragraph [ref=f40e209]
              - paragraph [ref=f40e211]: 3）控制台可以切换模拟设备，使截图更适合你自己的设备，也可以自行添加设备，建议添加设备如下：
              - paragraph [ref=f40e212]: 指定电子设备的显示高宽像素值，宽度值高度值建议如下。
              - paragraph [ref=f40e213]
              - paragraph [ref=f40e215]: 可以切换设备仿真 Ctrl+Shift+M
              - paragraph [ref=f40e216]
              - paragraph [ref=f40e218]
              - paragraph [ref=f40e219]: 生成的文件可以继续调用别的动作进行后续修改。
              - paragraph [ref=f40e220]
              - paragraph [ref=f40e221]: 如图片OCR（百度或者腾讯的高精度接口效果不错）。或者长图切割，在手机里面用漫画软件看书效果也很好。
              - paragraph [ref=f40e222]: 主要是墨水屏设备离线阅读需求，只在WIFI下阅读及流量无限的可以忽略。
