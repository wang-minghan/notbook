<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6B7A90" /></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D95C5C" /></marker></defs><rect width="1280" height="720" fill="#F7F9FC" /><rect width="1280" height="8" fill="#2F6BFF" /><text x="60" y="62" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#1C9C8C">24 / GOVERNANCE · INFORMATION ACCESS</text><text x="60" y="108" font-family="Microsoft YaHei,Arial" font-size="38" font-weight="700" fill="#1F2D3D">客户资料与信息权限</text><text x="60" y="140" font-family="Microsoft YaHei,Arial" font-size="17" fill="#526173">资料先分级，权限按需批准，使用可留痕，变化时及时回收</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA" /><text x="80" y="225" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#2F6BFF">资料分级漏斗</text><path d="M90 255 H390 L330 470 H150 Z" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="2" /><text x="240" y="295" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="17" font-weight="700" fill="#2F6BFF">客户 / 公司资料</text><text x="240" y="335" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="15" fill="#1F2D3D">图纸 · 报价 · 工艺</text><text x="240" y="370" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="15" fill="#1F2D3D">质量 · 人事 · 经营</text><text x="240" y="425" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="14" fill="#526173">按敏感度 / 业务需要分级</text><path d="M410 350 H510" fill="none" stroke="#2F6BFF" stroke-width="4" marker-end="url(#a)" /><path fill="#FFFFFF" stroke="#C56A25" stroke-width="2" d="M528,230 H802 A18,18 0 0 1 820,248 V462 A18,18 0 0 1 802,480 H528 A18,18 0 0 1 510,462 V248 A18,18 0 0 1 528,230 Z" /><text x="665" y="270" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#C56A25">角色权限控制</text><path fill="#FFF2E7" d="M574,300 H756 A19,19 0 0 1 775,319 V319 A19,19 0 0 1 756,338 H574 A19,19 0 0 1 555,319 V319 A19,19 0 0 1 574,300 Z" /><text x="665" y="325" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="14" fill="#C56A25">申请：为何需要</text><path d="M665 338 V360" stroke="#6B7A90" stroke-width="2" marker-end="url(#a)" /><path fill="#FFF7DF" d="M574,365 H756 A19,19 0 0 1 775,384 V384 A19,19 0 0 1 756,403 H574 A19,19 0 0 1 555,384 V384 A19,19 0 0 1 574,365 Z" /><text x="665" y="390" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="14" fill="#A87519">批准：最小权限</text><path d="M665 403 V425" stroke="#6B7A90" stroke-width="2" marker-end="url(#a)" /><path fill="#EAF7F4" d="M574,430 H756 A19,19 0 0 1 775,449 V449 A19,19 0 0 1 756,468 H574 A19,19 0 0 1 555,449 V449 A19,19 0 0 1 574,430 Z" /><text x="665" y="455" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="14" fill="#1C9C8C">使用：访问留痕</text><path d="M820 350 H900" fill="none" stroke="#1C9C8C" stroke-width="4" marker-end="url(#a)" /><path fill="#EAF7F4" stroke="#1C9C8C" stroke-width="2" d="M918,230 H1172 A18,18 0 0 1 1190,248 V462 A18,18 0 0 1 1172,480 H918 A18,18 0 0 1 900,462 V248 A18,18 0 0 1 918,230 Z" /><text x="1045" y="270" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#1C9C8C">回收与上报</text><text x="945" y="315" font-family="Microsoft YaHei,Arial" font-size="15" fill="#1F2D3D">岗位变化 → 权限复核</text><text x="945" y="350" font-family="Microsoft YaHei,Arial" font-size="15" fill="#1F2D3D">离岗 → 权限回收</text><text x="945" y="385" font-family="Microsoft YaHei,Arial" font-size="15" fill="#1F2D3D">异常访问 → 上报</text><text x="945" y="420" font-family="Microsoft YaHei,Arial" font-size="15" fill="#1F2D3D">客户要求 → 重新确认</text><path d="M1045 480 V535 H665 V480" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)" /><text x="855" y="560" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#B84747">异常 / 离岗触发回收，不等待下一次例行复核</text><path fill="#FFFFFF" stroke="#DCE4EE" d="M101,590 H1169 A21,21 0 0 1 1190,611 V611 A21,21 0 0 1 1169,632 H101 A21,21 0 0 1 80,611 V611 A21,21 0 0 1 101,590 Z" /><text x="635" y="617" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="14" fill="#526173">底部矩阵只表达“可见 / 不可见 / 需审批”，具体岗位权限以正式授权文件为准</text><text x="60" y="690" font-family="Microsoft YaHei,Arial" font-size="12" fill="#8A97A8">蓝色＝资料分级　橙色＝权限批准　青绿色＝留痕/回收　红色虚线＝异常回收</text></svg>