<text x="52" y="48" class="title">33｜管理体系证据链</text><text x="52" y="75" class="sub">从要求到执行、检查、整改和改进，形成可追溯的治理证据</text>
<text x="52" y="118" class="small" fill="#526173">证据链不是信息罗列，而是从要求到复盘的可追溯关系</text><rect x="60" y="250" width="150" height="108" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="135.0" y="290" text-anchor="middle" class="label">制度要求</text><text x="135.0" y="318" text-anchor="middle" class="tiny" fill="#526173">制度/标准</text><line x1="210" y1="304" x2="224" y2="304" stroke="#2F6BFF" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="228" y="250" width="150" height="108" rx="10" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="303.0" y="290" text-anchor="middle" class="label">责任活动</text><text x="303.0" y="318" text-anchor="middle" class="tiny" fill="#526173">岗位/部门</text><line x1="378" y1="304" x2="392" y2="304" stroke="#7657B8" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="396" y="250" width="150" height="108" rx="10" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="471.0" y="290" text-anchor="middle" class="label">执行记录</text><text x="471.0" y="318" text-anchor="middle" class="tiny" fill="#526173">表单/台账</text><line x1="546" y1="304" x2="560" y2="304" stroke="#1C9C8C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="564" y="250" width="150" height="108" rx="10" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="639.0" y="290" text-anchor="middle" class="label">检查结果</text><text x="639.0" y="318" text-anchor="middle" class="tiny" fill="#526173">测量/审核</text><line x1="714" y1="304" x2="728" y2="304" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="732" y="250" width="150" height="108" rx="10" fill="#FFFFFF" stroke="#D95C5C" stroke-width="3"/><text x="807.0" y="290" text-anchor="middle" class="label">整改证据</text><text x="807.0" y="318" text-anchor="middle" class="tiny" fill="#526173">问题/措施</text><line x1="882" y1="304" x2="896" y2="304" stroke="#D95C5C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="900" y="250" width="150" height="108" rx="10" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="975.0" y="290" text-anchor="middle" class="label">评审结论</text><text x="975.0" y="318" text-anchor="middle" class="tiny" fill="#526173">会议/决定</text><line x1="1050" y1="304" x2="1064" y2="304" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="1068" y="250" width="150" height="108" rx="10" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="1143.0" y="290" text-anchor="middle" class="label">改进证据</text><text x="1143.0" y="318" text-anchor="middle" class="tiny" fill="#526173">验证/更新</text><line x1="135.0" y1="358" x2="135.0" y2="390" stroke="#526173" stroke-width="2"/><rect x="78" y="390" width="114" height="34" rx="6" fill="#EEF3F8" stroke="#D7E0EA"/><text x="135.0" y="412" text-anchor="middle" class="tiny" fill="#526173">证据：制度条款</text><line x1="303.0" y1="358" x2="303.0" y2="390" stroke="#526173" stroke-width="2"/><rect x="246" y="390" width="114" height="34" rx="6" fill="#EEF3F8" stroke="#D7E0EA"/><text x="303.0" y="412" text-anchor="middle" class="tiny" fill="#526173">证据：责任记录</text><line x1="471.0" y1="358" x2="471.0" y2="390" stroke="#526173" stroke-width="2"/><rect x="414" y="390" width="114" height="34" rx="6" fill="#EEF3F8" stroke="#D7E0EA"/><text x="471.0" y="412" text-anchor="middle" class="tiny" fill="#526173">证据：执行台账</text><line x1="639.0" y1="358" x2="639.0" y2="390" stroke="#526173" stroke-width="2"/><rect x="582" y="390" width="114" height="34" rx="6" fill="#EEF3F8" stroke="#D7E0EA"/><text x="639.0" y="412" text-anchor="middle" class="tiny" fill="#526173">证据：检查报告</text><line x1="807.0" y1="358" x2="807.0" y2="390" stroke="#526173" stroke-width="2"/><rect x="750" y="390" width="114" height="34" rx="6" fill="#EEF3F8" stroke="#D7E0EA"/><text x="807.0" y="412" text-anchor="middle" class="tiny" fill="#526173">证据：整改闭环</text><line x1="975.0" y1="358" x2="975.0" y2="390" stroke="#526173" stroke-width="2"/><rect x="918" y="390" width="114" height="34" rx="6" fill="#EEF3F8" stroke="#D7E0EA"/><text x="975.0" y="412" text-anchor="middle" class="tiny" fill="#526173">证据：会议纪要</text><line x1="1143.0" y1="358" x2="1143.0" y2="390" stroke="#526173" stroke-width="2"/><rect x="1086" y="390" width="114" height="34" rx="6" fill="#EEF3F8" stroke="#D7E0EA"/><text x="1143.0" y="412" text-anchor="middle" class="tiny" fill="#526173">证据：版本更新</text><path d="M135 430 C135 535,1110 535,1110 430" fill="none" stroke="#1C9C8C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowTeal)"/><text x="620" y="565" text-anchor="middle" class="small" fill="#1C9C8C">复盘反馈：改进结果反向更新制度、责任、表单或检查方式</text><rect x="90" y="150" width="1080" height="48" rx="8" fill="#EAF0FF" stroke="#B7C9FF"/><text x="630" y="180" text-anchor="middle" class="label" fill="#2F6BFF">每一段都应能回答：谁负责？留下什么记录？由谁验证？</text><rect x="90" y="590" width="1080" height="42" rx="6" fill="#FFF7DF" stroke="#E8D39A"/><text x="630" y="616" text-anchor="middle" class="tiny" fill="#A87519">待确认：正式表单编号、记录保存期限、评审频次和证据归档位置</text>
<line x1="52" y1="680" x2="1228" y2="680" stroke="#D7E0EA"/><text x="52" y="704" class="tiny" fill="#526173">鑫犇电子｜治理体系草案｜图形原型，待正式流程/授权文件确认</text><text x="1190" y="704" class="tiny" fill="#526173">DRAFT</text></svg>