<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/><text x="60" y="68" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1C9C8C">30 / GOVERNANCE</text><text x="60" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="40" font-weight="bold" fill="#1F2D3D">不符合项与整改关闭</text><text x="60" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#526173">整改必须有原因、措施、期限、验证和复发控制</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/><g id="main-content" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><rect x="70" y="270" width="170" height="115" rx="16" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="155" y="315" font-size="19" font-weight="bold" fill="#2F6BFF">01 发现登记</text><text x="155" y="347" font-size="14" fill="#526173">事实｜证据｜来源</text><rect x="270" y="270" width="170" height="115" rx="16" fill="#FFFFFF" stroke="#D95C5C" stroke-width="3"/><text x="355" y="315" font-size="19" font-weight="bold" fill="#B84747">02 分级升级</text><text x="355" y="347" font-size="14" fill="#526173">风险｜责任｜期限</text><rect x="470" y="270" width="170" height="115" rx="16" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="555" y="315" font-size="19" font-weight="bold" fill="#7657B8">03 原因分析</text><text x="555" y="347" font-size="14" fill="#526173">根因｜复发控制</text><rect x="670" y="270" width="170" height="115" rx="16" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="755" y="315" font-size="19" font-weight="bold" fill="#C56A25">04 制定措施</text><text x="755" y="347" font-size="14" fill="#526173">责任｜期限｜记录</text><rect x="870" y="270" width="170" height="115" rx="16" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="955" y="315" font-size="19" font-weight="bold" fill="#1C9C8C">05 效果验证</text><text x="955" y="347" font-size="14" fill="#526173">证据｜有效性</text><rect x="1070" y="270" width="150" height="115" rx="16" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="1145" y="315" font-size="19" font-weight="bold" fill="#1C9C8C">06 关闭</text><text x="1145" y="347" font-size="14" fill="#526173">批准｜留痕</text></g><path d="M240 327 H270 M440 327 H470 M640 327 H670 M840 327 H870 M1040 327 H1070" stroke="#8091A5" stroke-width="4" marker-end="url(#a)"/><path d="M1070 385 C1030 510 500 545 355 385" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#r)"/><text x="520" y="520" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#B84747">验证失败/逾期/复发：再升级，不直接关闭</text><text x="70" y="600" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#A87519">责任岗位、整改期限和关闭权限：待确认，以正式授权文件为准</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">鑫犇电子有限公司｜公司治理与管理方法</text><text x="1220" y="690" text-anchor="end" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">30</text><defs><marker id="a" markerWidth="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8091A5"/></marker><marker id="r" markerWidth="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D95C5C"/></marker></defs></svg>