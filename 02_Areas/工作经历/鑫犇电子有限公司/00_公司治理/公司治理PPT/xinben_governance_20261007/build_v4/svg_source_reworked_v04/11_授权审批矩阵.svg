<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/><text x="60" y="62" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#1C9C8C">11 / GOVERNANCE · APPROVAL MATRIX</text><text x="60" y="108" font-family="Microsoft YaHei,Arial" font-size="38" font-weight="700" fill="#1F2D3D">授权审批矩阵</text><text x="60" y="140" font-family="Microsoft YaHei,Arial" font-size="17" fill="#526173">事项分拆呈现经办、专业复核/咨询与批准；C仅表示事前咨询，不代表复核或审批</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/><rect x="70" y="185" width="260" height="42" rx="6" fill="#EAF0FF" stroke="#D7E0EA" stroke-width="2"/><text x="200.0" y="212" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" font-weight="700" fill="#2F6BFF">事项 / 来源</text><rect x="350" y="185" width="200" height="42" rx="6" fill="#EAF0FF" stroke="#D7E0EA" stroke-width="2"/><text x="450.0" y="212" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" font-weight="700" fill="#2F6BFF">经办 R</text><rect x="570" y="185" width="200" height="42" rx="6" fill="#EAF0FF" stroke="#D7E0EA" stroke-width="2"/><text x="670.0" y="212" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" font-weight="700" fill="#2F6BFF">专业复核 / 咨询</text><rect x="790" y="185" width="160" height="42" rx="6" fill="#EAF0FF" stroke="#D7E0EA" stroke-width="2"/><text x="870.0" y="212" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" font-weight="700" fill="#2F6BFF">批准 A</text><rect x="970" y="185" width="250" height="42" rx="6" fill="#EAF0FF" stroke="#D7E0EA" stroke-width="2"/><text x="1095.0" y="212" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" font-weight="700" fill="#2F6BFF">待确认边界</text><rect x="70" y="235" width="260" height="62" rx="6" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/><text x="80" y="260" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="700" fill="#1F2D3D">订单评审｜RACI-004</text><rect x="350" y="235" width="200" height="62" rx="6" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/><text x="360" y="260" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="400" fill="#1F2D3D">生产、品质、工程技术、业务、采购、仓储</text><rect x="570" y="235" width="200" height="62" rx="6" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/><text x="580" y="260" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="400" fill="#1F2D3D">专业输入（C按原矩阵）</text><rect x="790" y="235" width="160" height="62" rx="6" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/><text x="800" y="260" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="700" fill="#C56A25">营运部</text><rect x="970" y="235" width="250" height="62" rx="6" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/><text x="980" y="260" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="400" fill="#1F2D3D">订单承诺例外权限待确认</text><rect x="70" y="307" width="260" height="62" rx="6" fill="#FBFCFE" stroke="#D7E0EA" stroke-width="2"/><text x="80" y="332" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="700" fill="#1F2D3D">采购寻源下单｜RACI-005</text><rect x="350" y="307" width="200" height="62" rx="6" fill="#FBFCFE" stroke="#D7E0EA" stroke-width="2"/><text x="360" y="332" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="400" fill="#1F2D3D">业务组、采购组、仓储组</text><rect x="570" y="307" width="200" height="62" rx="6" fill="#FBFCFE" stroke="#D7E0EA" stroke-width="2"/><text x="580" y="332" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="400" fill="#1F2D3D">生产/品质/财务咨询（C）</text><rect x="790" y="307" width="160" height="62" rx="6" fill="#FBFCFE" stroke="#D7E0EA" stroke-width="2"/><text x="800" y="332" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="700" fill="#C56A25">营运部</text><rect x="970" y="307" width="250" height="62" rx="6" fill="#FBFCFE" stroke="#D7E0EA" stroke-width="2"/><text x="980" y="332" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="400" fill="#1F2D3D">金额阈值、供应商例外待确认</text><rect x="70" y="379" width="260" height="62" rx="6" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/><text x="80" y="404" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="700" fill="#1F2D3D">来料检验｜RACI-011</text><rect x="350" y="379" width="200" height="62" rx="6" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/><text x="360" y="404" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="400" fill="#1F2D3D">成品出货检验组</text><rect x="570" y="379" width="200" height="62" rx="6" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/><text x="580" y="404" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="400" fill="#1F2D3D">营运部/采购/仓储咨询（C）</text><rect x="790" y="379" width="160" height="62" rx="6" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/><text x="800" y="404" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="700" fill="#C56A25">品质部</text><rect x="970" y="379" width="250" height="62" rx="6" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/><text x="980" y="404" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="400" fill="#1F2D3D">特采/让步放行权限待确认</text><rect x="70" y="451" width="260" height="62" rx="6" fill="#FBFCFE" stroke="#D7E0EA" stroke-width="2"/><text x="80" y="476" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="700" fill="#1F2D3D">付款与费用审批｜RACI-015</text><rect x="350" y="451" width="200" height="62" rx="6" fill="#FBFCFE" stroke="#D7E0EA" stroke-width="2"/><text x="360" y="476" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="400" fill="#1F2D3D">财务部</text><rect x="570" y="451" width="200" height="62" rx="6" fill="#FBFCFE" stroke="#D7E0EA" stroke-width="2"/><text x="580" y="476" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="400" fill="#1F2D3D">生产/品质/营运咨询（C）</text><rect x="790" y="451" width="160" height="62" rx="6" fill="#FBFCFE" stroke="#D7E0EA" stroke-width="2"/><text x="800" y="476" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="700" fill="#C56A25">总经理</text><rect x="970" y="451" width="250" height="62" rx="6" fill="#FBFCFE" stroke="#D7E0EA" stroke-width="2"/><text x="980" y="476" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="11" font-weight="400" fill="#1F2D3D">金额分级、超限/替代批准待确认</text><rect x="70" y="545" width="1160" height="84" rx="12" fill="#FFF7DF" stroke="#A87519" stroke-width="2"/><text x="650" y="575" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#805B12">授权事实：仅列受控RACI明确的A/R；C=事前咨询（双向专业输入），不是“复核”。</text><text x="650" y="603" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" font-weight="400" fill="#805B12">边界：金额权限、付款分级、特殊放行及代理/替代批准人均待正式授权文件确认。</text><text x="60" y="692" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12" font-weight="400" fill="#8A97A8">审批角色与RACI参与语义分栏；具体复核岗位未由源矩阵明确的，不推定为既有批准权。</text></svg>