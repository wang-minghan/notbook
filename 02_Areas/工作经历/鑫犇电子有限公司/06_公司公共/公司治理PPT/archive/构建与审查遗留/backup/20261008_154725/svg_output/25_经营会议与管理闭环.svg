<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6B7A90"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D95C5C"/></marker></defs><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/><text x="60" y="62" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#1C9C8C">25 / GOVERNANCE · MANAGEMENT LOOP</text><text x="60" y="108" font-family="Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="700" fill="#1F2D3D">经营会议与管理闭环</text><text x="60" y="140" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526173">会议不是终点：决定必须转化为责任、期限、验证和关闭证据</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/><circle cx="640" cy="370" r="105" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="3"/><text x="640" y="360" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#2F6BFF">经营会议</text><text x="640" y="392" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526173">管理评审 / 决策中心</text><g id="group_25_经营会议与管理闭环_labels" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><rect x="100" y="220" width="240" height="90" rx="16" fill="#EAF7F4" stroke="#1C9C8C" stroke-width="2"/><text x="220" y="255" font-size="17" font-weight="700" fill="#1C9C8C">数据输入</text><text x="220" y="282" font-size="14" fill="#526173">交付 · 质量 · 供应 · 现金 · 能力</text><rect x="940" y="220" width="240" height="90" rx="16" fill="#FFF2E7" stroke="#C56A25" stroke-width="2"/><text x="1060" y="255" font-size="17" font-weight="700" fill="#C56A25">会议输出</text><text x="1060" y="282" font-size="14" fill="#526173">决定 · 责任人 · 期限 · 验收标准</text><rect x="100" y="455" width="240" height="90" rx="16" fill="#F2ECFF" stroke="#7657B8" stroke-width="2"/><text x="220" y="490" font-size="17" font-weight="700" fill="#7657B8">跟踪验证</text><text x="220" y="517" font-size="14" fill="#526173">按期检查结果与证据</text><rect x="940" y="455" width="240" height="90" rx="16" fill="#EAF7F4" stroke="#1C9C8C" stroke-width="2"/><text x="1060" y="490" font-size="17" font-weight="700" fill="#1C9C8C">归档关闭</text><text x="1060" y="517" font-size="14" fill="#526173">完成证据 · 复盘结论</text></g><path d="M340 265 H490" fill="none" stroke="#1C9C8C" stroke-width="3" marker-end="url(#a)"/><path d="M790 265 H940" fill="none" stroke="#C56A25" stroke-width="3" marker-end="url(#a)"/><path d="M940 500 H790" fill="none" stroke="#1C9C8C" stroke-width="3" marker-end="url(#a)"/><path d="M490 500 H340" fill="none" stroke="#7657B8" stroke-width="3" marker-end="url(#a)"/><path d="M220 455 V370 H535" fill="none" stroke="#7657B8" stroke-width="3" marker-end="url(#a)"/><path d="M745 370 H1060 V455" fill="none" stroke="#1C9C8C" stroke-width="3" marker-end="url(#a)"/><path d="M1180 500 V600 H220 V545" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)"/><text x="700" y="592" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#B84747">未完成 / 验证不通过：红色升级，回到责任人和决策中心</text><rect x="460" y="620" width="360" height="34" rx="17" fill="#FFFFFF" stroke="#DCE4EE"/><text x="640" y="642" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#526173">会议纪要 ≠ 关闭证据　关闭必须可验证</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" fill="#8A97A8">蓝色＝会议中心　青绿色＝输入/关闭　橙色＝决定　红色虚线＝逾期升级</text></svg>