<text x="60" y="68" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#1C9C8C">14 / GOVERNANCE</text><text x="60" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="40" font-weight="700" fill="#1F2D3D">订单与变更控制</text><text x="60" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#526173">口头变化必须转化为受控评审；批准、拒绝和旧版隔离都要有证据</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA" />
