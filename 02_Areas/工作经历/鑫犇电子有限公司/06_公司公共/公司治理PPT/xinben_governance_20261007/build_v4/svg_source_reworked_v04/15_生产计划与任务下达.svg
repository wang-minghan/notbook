 <g filter="url(#shadow)"><path fill="#FFF0F0" stroke="#D95C5C" stroke-width="2" d="M438,505 H632 A18,18 0 0 1 650,523 V559 A18,18 0 0 1 632,577 H438 A18,18 0 0 1 420,559 V523 A18,18 0 0 1 438,505 Z" /><text x="535" y="537" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="19" fill="#1F2D3D" font-weight="700">反馈 / 升级</text><text x="535" y="558" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="12" fill="#526173">不得直接开工</text></g>
 <path d="M420 541 C340 500 330 380 390 320" fill="none" stroke="#D95C5C" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-red)" />
</g>
<path fill="#FFFFFF" stroke="#D7E0EA" d="M142,620 H1138 A22,22 0 0 1 1160,642 V642 A22,22 0 0 1 1138,664 H142 A22,22 0 0 1 120,642 V642 A22,22 0 0 1 142,620 Z" /><text x="640" y="648" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="15" font-weight="700" fill="#526173">实线＝正常放行　红色虚线＝资源不足或风险升级　菱形＝开工决策闸口</text>
<text x="60" y="692" font-family="Microsoft YaHei,Arial" font-size="12" fill="#8A97A8">任务发布前必须完成能力确认；交期承诺不能绕过资源与版本检查</text>
