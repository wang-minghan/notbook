<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#8091A5"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#D95C5C"/></marker><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#AAB7C6" flood-opacity=".22"/></filter></defs>
<rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/>
<text x="60" y="68" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#1C9C8C">15 / GOVERNANCE</text><text x="60" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="40" font-weight="700" fill="#1F2D3D">生产计划与任务下达</text><text x="60" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#526173">开工前确认产品、资源、交期和受控版本；条件不满足时必须回到补充与升级</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/>
<g id="obj_15_capacity_decision">
 <g filter="url(#shadow)"><rect x="90" y="270" width="210" height="100" rx="18" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/><text x="195" y="305" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#2F6BFF" font-weight="700">INPUT</text><text x="195" y="338" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="22" fill="#1F2D3D" font-weight="700">订单输入</text><text x="195" y="360" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">产品、数量、交期、版本</text></g>
 <path d="M300 320 H390" stroke="#8091A5" stroke-width="5" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><rect x="390" y="270" width="220" height="100" rx="18" fill="#EAF7F4" stroke="#1C9C8C" stroke-width="2"/><text x="500" y="305" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1C9C8C" font-weight="700">CHECK</text><text x="500" y="338" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="22" fill="#1F2D3D" font-weight="700">能力确认</text><text x="500" y="360" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">产能、物料、模具、人员</text></g>
 <path d="M610 320 H695" stroke="#8091A5" stroke-width="5" marker-end="url(#arrow)"/>
 <g filter="url(#shadow)"><path d="M790 245 L900 320 L790 395 L680 320 Z" fill="#FFF7DF" stroke="#D79A2B" stroke-width="3"/><text x="790" y="315" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="20" fill="#805B12" font-weight="700">条件满足？</text><text x="790" y="340" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#805B12">是否可按期执行</text></g>
 <path d="M900 320 H990" stroke="#8091A5" stroke-width="5" marker-end="url(#arrow)"/><text x="935" y="305" font-family="Microsoft YaHei,Arial" font-size="14" fill="#1C9C8C" font-weight="700">是</text>
 <g filter="url(#shadow)"><rect x="990" y="270" width="210" height="100" rx="18" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="2"/><text x="1095" y="305" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#2F6BFF" font-weight="700">RELEASE</text><text x="1095" y="338" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="22" fill="#1F2D3D" font-weight="700">任务发布</text><text x="1095" y="360" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">受控版本、责任、节点</text></g>
 <path d="M790 395 C790 500 610 555 500 450 C465 415 470 385 500 370" fill="none" stroke="#D95C5C" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#arrow-red)"/><text x="655" y="520" font-family="Microsoft YaHei,Arial" font-size="14" fill="#B84747" font-weight="700">否：形成风险清单，补充资源或升级承诺</text>
 <g filter="url(#shadow)"><rect x="420" y="505" width="230" height="72" rx="18" fill="#FFF0F0" stroke="#D95C5C" stroke-width="2"/><text x="535" y="537" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="19" fill="#1F2D3D" font-weight="700">反馈 / 升级</text><text x="535" y="558" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="12" fill="#526173">不得直接开工</text></g>
 <path d="M420 541 C340 500 330 380 390 320" fill="none" stroke="#D95C5C" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/>
</g>
<rect x="120" y="620" width="1040" height="44" rx="22" fill="#FFFFFF" stroke="#D7E0EA"/><text x="640" y="648" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="15" font-weight="700" fill="#526173">实线＝正常放行　红色虚线＝资源不足或风险升级　菱形＝开工决策闸口</text>
<text x="60" y="692" font-family="Microsoft YaHei,Arial" font-size="12" fill="#8A97A8">任务发布前必须完成能力确认；交期承诺不能绕过资源与版本检查</text>
</svg>