<text x="52" y="48" class="title">23｜人员能力与岗位授权</text><text x="52" y="75" class="sub">能力确认阶梯 + 授权生命周期：证据齐全后授权，变化触发复核</text>
<text x="52" y="116" class="small" fill="#526173">培训不等于授权：能力确认是权限打开前的闸门，失效时立即暂停或回收</text><rect x="70" y="190" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="180" y="230" text-anchor="middle" class="label">培训</text><text x="180" y="260" text-anchor="middle" class="small" fill="#526173">培训记录</text><line x1="290" y1="240" x2="332" y2="240" stroke="#7657B8" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="350" y="190" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="460" y="230" text-anchor="middle" class="label">能力确认</text><text x="460" y="260" text-anchor="middle" class="small" fill="#526173">评价结果</text><line x1="570" y1="240" x2="612" y2="240" stroke="#7657B8" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="630" y="190" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="740" y="230" text-anchor="middle" class="label">岗位授权</text><text x="740" y="260" text-anchor="middle" class="small" fill="#526173">授权批准</text><line x1="850" y1="240" x2="892" y2="240" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="910" y="190" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="1020" y="230" text-anchor="middle" class="label">有效维护</text><text x="1020" y="260" text-anchor="middle" class="small" fill="#526173">复核日期</text><rect x="70" y="370" width="1090" height="130" rx="10" fill="#FFFFFF" stroke="#D7E0EA"/><text x="100" y="410" class="label">授权生命周期</text><text x="100" y="450" class="small" fill="#526173">维护与复核 → 复训 / 调岗 / 替代 → 失效时暂停 → 离岗或不合格时回收权限</text><path d="M1080 290 C1160 340,1160 470,1010 470" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/><text x="1010" y="540" text-anchor="middle" class="small" fill="#D95C5C">能力失效：暂停 / 回收</text>
<line x1="52" y1="680" x2="1228" y2="680" stroke="#D7E0EA"/><text x="52" y="704" class="tiny" fill="#526173">鑫犇电子｜治理体系草案｜图形原型，待正式流程/授权文件确认</text><text x="1190" y="704" class="tiny" fill="#526173">DRAFT</text></svg>