<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/><text x="60" y="68" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1C9C8C">05 / GOVERNANCE</text><text x="60" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="40" font-weight="bold" fill="#1F2D3D">制度文件层级</text><text x="60" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#526173">从治理原则到执行记录，层级不同、控制对象不同</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/><text x="90" y="220" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="bold" fill="#8190A0">控制关系：上层定义边界，下层承接执行</text><path d="M640 250 L640 570" stroke="#8091A5" stroke-width="4" marker-end="url(#a)"/><rect x="160" y="250" width="960" height="70" rx="14" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="210" y="294" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="bold" fill="#2F6BFF">治理原则</text><text x="500" y="294" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#1F2D3D">战略｜权责｜授权｜风险边界</text><rect x="220" y="345" width="840" height="70" rx="14" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="270" y="389" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="bold" fill="#1C9C8C">管理制度</text><text x="540" y="389" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#1F2D3D">人事｜合同｜采购｜生产｜品质｜财务｜安全｜信息</text><rect x="280" y="440" width="720" height="70" rx="14" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="330" y="484" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="bold" fill="#C56A25">流程程序 / SOP</text><text x="630" y="484" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#1F2D3D">步骤、控制点、岗位接口</text><rect x="340" y="535" width="600" height="70" rx="14" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="390" y="579" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="bold" fill="#7657B8">表单 / 台账 / 记录</text><text x="690" y="579" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#1F2D3D">执行证据与追溯</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">鑫犇电子有限公司｜公司治理与管理方法</text><text x="1220" y="690" text-anchor="end" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">05</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8091A5"/></marker></defs></svg>