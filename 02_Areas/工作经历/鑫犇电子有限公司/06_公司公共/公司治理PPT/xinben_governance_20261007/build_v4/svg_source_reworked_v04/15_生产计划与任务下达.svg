<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#8091A5" /></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#D95C5C" /></marker><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#AAB7C6" flood-opacity=".22" /></filter></defs>
<rect width="1280" height="720" fill="#F7F9FC" /><rect width="1280" height="8" fill="#2F6BFF" />
<text x="60" y="68" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#1C9C8C">15 / GOVERNANCE</text><text x="60" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="40" font-weight="700" fill="#1F2D3D">生产计划与任务下达</text><text x="60" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#526173">开工前确认产品、资源、交期和受控版本；条件不满足时必须回到补充与升级</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA" />
<g id="obj_15_capacity_decision">
 <g filter="url(#shadow)"><path fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2" d="M108,270 H282 A18,18 0 0 1 300,288 V352 A18,18 0 0 1 282,370 H108 A18,18 0 0 1 90,352 V288 A18,18 0 0 1 108,270 Z" /><text x="195" y="305" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#2F6BFF" font-weight="700">INPUT</text><text x="195" y="338" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="22" fill="#1F2D3D" font-weight="700">订单输入</text><text x="195" y="360" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">产品、数量、交期、版本</text></g>
 <path d="M300 320 H390" stroke="#8091A5" stroke-width="5" marker-end="url(#arrow)" />
