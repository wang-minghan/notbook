<text x="52" y="48" class="title">29｜内部检查与管理评审</text><text x="52" y="75" class="sub">计划—检查—分级—评审—跟踪，形成可回到下一轮的管理回路</text>
<text x="52" y="116" class="small" fill="#526173">按过程检查证据，再由管理评审形成决策；跟踪结果进入下一轮检查</text><rect x="75" y="245" width="205" height="112" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="177.5" y="287" text-anchor="middle" class="label">01 制定计划</text><text x="177.5" y="320" text-anchor="middle" class="small" fill="#526173">范围｜过程｜证据</text><line x1="280" y1="301" x2="307" y2="301" stroke="#2F6BFF" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="315" y="245" width="205" height="112" rx="10" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="417.5" y="287" text-anchor="middle" class="label">02 过程检查</text><text x="417.5" y="320" text-anchor="middle" class="small" fill="#526173">现场｜记录｜访谈</text><line x1="520" y1="301" x2="547" y2="301" stroke="#1C9C8C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="555" y="245" width="205" height="112" rx="10" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="657.5" y="287" text-anchor="middle" class="label">03 发现分级</text><text x="657.5" y="320" text-anchor="middle" class="small" fill="#526173">事实｜风险｜整改</text><line x1="760" y1="301" x2="787" y2="301" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="795" y="245" width="205" height="112" rx="10" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="897.5" y="287" text-anchor="middle" class="label">04 管理评审</text><text x="897.5" y="320" text-anchor="middle" class="small" fill="#526173">输入｜决策｜资源</text><line x1="1000" y1="301" x2="1027" y2="301" stroke="#7657B8" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="1035" y="245" width="205" height="112" rx="10" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="1137.5" y="287" text-anchor="middle" class="label">05 跟踪</text><text x="1137.5" y="320" text-anchor="middle" class="small" fill="#526173">关闭证据</text><path d="M1150 410 C1080 550,350 570,220 410" fill="none" stroke="#1C9C8C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowTeal)"/><text x="690" y="565" text-anchor="middle" class="small" fill="#1C9C8C">跟踪结果：进入下一轮检查与评审</text><rect x="100" y="150" width="1080" height="48" rx="8" fill="#FFF7DF" stroke="#E8D39A"/><text x="640" y="180" text-anchor="middle" class="label" fill="#A87519">管理评审输入、输出和频次：待确认，以正式机制为准</text>
<line x1="52" y1="680" x2="1228" y2="680" stroke="#D7E0EA"/><text x="52" y="704" class="tiny" fill="#526173">鑫犇电子｜治理体系草案｜图形原型，待正式流程/授权文件确认</text><text x="1190" y="704" class="tiny" fill="#526173">DRAFT</text></svg>