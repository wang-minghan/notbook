<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC" /><rect width="1280" height="8" fill="#2F6BFF" /><text x="60" y="68" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1C9C8C">28 / GOVERNANCE</text><text x="60" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="40" font-weight="bold" fill="#1F2D3D">安全、环保与应急</text><text x="60" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#526173">发现—处置—上报—调查—整改—验证，现场与管理层共同承接</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA" /><g id="main-content" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><path fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3" d="M86,250 H224 A16,16 0 0 1 240,266 V344 A16,16 0 0 1 224,360 H86 A16,16 0 0 1 70,344 V266 A16,16 0 0 1 86,250 Z" /><text x="155" y="295" font-size="19" font-weight="bold" fill="#2F6BFF">01 发现</text><text x="155" y="325" font-size="14" fill="#526173">日常检查/事件触发</text><path fill="#FFFFFF" stroke="#D95C5C" stroke-width="3" d="M286,250 H424 A16,16 0 0 1 440,266 V344 A16,16 0 0 1 424,360 H286 A16,16 0 0 1 270,344 V266 A16,16 0 0 1 286,250 Z" /><text x="355" y="295" font-size="19" font-weight="bold" fill="#B84747">02 现场处置</text><text x="355" y="325" font-size="14" fill="#526173">先控制人身/环境风险</text><path fill="#FFFFFF" stroke="#C56A25" stroke-width="3" d="M486,250 H624 A16,16 0 0 1 640,266 V344 A16,16 0 0 1 624,360 H486 A16,16 0 0 1 470,344 V266 A16,16 0 0 1 486,250 Z" /><text x="555" y="295" font-size="19" font-weight="bold" fill="#C56A25">03 逐级上报</text><text x="555" y="325" font-size="14" fill="#526173">按分级要求报告</text><path fill="#FFFFFF" stroke="#7657B8" stroke-width="3" d="M716,250 H854 A16,16 0 0 1 870,266 V344 A16,16 0 0 1 854,360 H716 A16,16 0 0 1 700,344 V266 A16,16 0 0 1 716,250 Z" /><text x="785" y="295" font-size="19" font-weight="bold" fill="#7657B8">04 责任调查</text><text x="785" y="325" font-size="14" fill="#526173">事实、原因、证据</text><path fill="#FFFFFF" stroke="#C56A25" stroke-width="3" d="M916,250 H1054 A16,16 0 0 1 1070,266 V344 A16,16 0 0 1 1054,360 H916 A16,16 0 0 1 900,344 V266 A16,16 0 0 1 916,250 Z" /><text x="985" y="295" font-size="19" font-weight="bold" fill="#C56A25">05 整改</text><text x="985" y="325" font-size="14" fill="#526173">措施、责任、记录</text><path fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3" d="M1016,450 H1174 A16,16 0 0 1 1190,466 V544 A16,16 0 0 1 1174,560 H1016 A16,16 0 0 1 1000,544 V466 A16,16 0 0 1 1016,450 Z" /><text x="1095" y="495" font-size="19" font-weight="bold" fill="#1C9C8C">06 验证关闭</text><text x="1095" y="525" font-size="14" fill="#526173">效果确认/复发控制</text></g><path d="M240 305 H270 M440 305 H470 M640 305 H700 M870 305 H900 M985 360 V450 H1095" stroke="#8091A5" stroke-width="4" fill="none" marker-end="url(#a)" /><path d="M1000 505 H820 C760 505 740 430 740 360" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#r)" /><text x="770" y="535" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#B84747">未通过/复发：再调查或升级</text><text x="70" y="620" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#A87519">响应级别、通知时限和责任岗位：待确认，以正式应急文件为准</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">鑫犇电子有限公司｜公司治理与管理方法</text><text x="1220" y="690" text-anchor="end" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">28</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8091A5" /></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D95C5C" /></marker></defs></svg>