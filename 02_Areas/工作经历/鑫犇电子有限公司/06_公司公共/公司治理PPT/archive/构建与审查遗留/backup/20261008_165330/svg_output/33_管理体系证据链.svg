<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/><text x="60" y="68" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1C9C8C">33 / GOVERNANCE</text><text x="60" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="40" font-weight="bold" fill="#1F2D3D">管理体系证据链</text><text x="60" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#526173">制度要求必须经过责任承接、流程执行和记录复核，形成可追溯链条</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/><g id="main-content" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><rect x="70" y="270" width="165" height="105" rx="16" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="152" y="312" font-size="19" font-weight="bold" fill="#2F6BFF">01 要求</text><text x="152" y="343" font-size="14" fill="#526173">原则/制度条款</text><rect x="255" y="270" width="165" height="105" rx="16" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="337" y="312" font-size="19" font-weight="bold" fill="#C56A25">02 责任</text><text x="337" y="343" font-size="14" fill="#526173">岗位/接口/权限</text><rect x="440" y="270" width="165" height="105" rx="16" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="522" y="312" font-size="19" font-weight="bold" fill="#1C9C8C">03 流程</text><text x="522" y="343" font-size="14" fill="#526173">步骤/控制点</text><rect x="625" y="270" width="165" height="105" rx="16" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="707" y="312" font-size="19" font-weight="bold" fill="#7657B8">04 表单</text><text x="707" y="343" font-size="14" fill="#526173">输入/输出/记录项</text><rect x="810" y="270" width="165" height="105" rx="16" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="892" y="312" font-size="19" font-weight="bold" fill="#1C9C8C">05 记录</text><text x="892" y="343" font-size="14" fill="#526173">执行证据/留痕</text><rect x="995" y="270" width="190" height="105" rx="16" fill="#FFFFFF" stroke="#A87519" stroke-width="3"/><text x="1090" y="312" font-size="19" font-weight="bold" fill="#A87519">06 复核改进</text><text x="1090" y="343" font-size="14" fill="#526173">检查/评审/改进</text></g><path d="M235 322 H255 M420 322 H440 M605 322 H625 M790 322 H810 M975 322 H995" stroke="#8091A5" stroke-width="4" marker-end="url(#a)"/><path d="M1090 375 C1080 500 180 520 152 375" fill="none" stroke="#1C9C8C" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="445" y="515" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#1C9C8C">复核结果反向验证要求是否有效，并进入下一轮改进</text><text x="70" y="600" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#A87519">具体文件编号、责任岗位和记录保存要求：待确认</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">鑫犇电子有限公司｜公司治理与管理方法</text><text x="1220" y="690" text-anchor="end" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">33</text><defs><marker id="a" markerWidth="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8091A5"/></marker></defs></svg>