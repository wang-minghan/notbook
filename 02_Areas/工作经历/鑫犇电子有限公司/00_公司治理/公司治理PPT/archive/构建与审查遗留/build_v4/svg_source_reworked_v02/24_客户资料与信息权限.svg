<text x="52" y="48" class="title">24｜客户资料与信息权限</text><text x="52" y="75" class="sub">用权限矩阵表达可见、不可见和需审批；旁置申请—批准—留痕—回收闭环</text>
<text x="52" y="118" class="small" fill="#526173">资料类型 × 角色/部门 × 权限动作：先批准最小权限，再持续留痕和回收</text><rect x="70" y="170" width="150" height="46" fill="#EAF0FF" stroke="#D7E0EA"/><text x="145.0" y="199" text-anchor="middle" class="label">资料类型</text><rect x="220" y="170" width="150" height="46" fill="#EEF3F8" stroke="#D7E0EA"/><text x="295.0" y="199" text-anchor="middle" class="label">营运/销售</text><rect x="370" y="170" width="150" height="46" fill="#EEF3F8" stroke="#D7E0EA"/><text x="445.0" y="199" text-anchor="middle" class="label">技术/工程</text><rect x="520" y="170" width="150" height="46" fill="#EEF3F8" stroke="#D7E0EA"/><text x="595.0" y="199" text-anchor="middle" class="label">品质/财务</text><rect x="670" y="170" width="150" height="46" fill="#EEF3F8" stroke="#D7E0EA"/><text x="745.0" y="199" text-anchor="middle" class="label">管理层</text><rect x="70" y="216" width="150" height="52" fill="#F7F9FC" stroke="#D7E0EA"/><text x="145.0" y="247" text-anchor="middle" class="small">报价/订单</text><rect x="220" y="216" width="150" height="52" fill="#FFF7DF" stroke="#C56A25"/><text x="295.0" y="247" text-anchor="middle" class="small">需审批</text><rect x="370" y="216" width="150" height="52" fill="#EAF7F4" stroke="#1C9C8C"/><text x="445.0" y="247" text-anchor="middle" class="small">可见</text><rect x="520" y="216" width="150" height="52" fill="#EAF7F4" stroke="#1C9C8C"/><text x="595.0" y="247" text-anchor="middle" class="small">可见</text><rect x="670" y="216" width="150" height="52" fill="#EAF7F4" stroke="#1C9C8C"/><text x="745.0" y="247" text-anchor="middle" class="small">可见</text><rect x="70" y="268" width="150" height="52" fill="#F7F9FC" stroke="#D7E0EA"/><text x="145.0" y="299" text-anchor="middle" class="small">图纸/工艺</text><rect x="220" y="268" width="150" height="52" fill="#EAF7F4" stroke="#1C9C8C"/><text x="295.0" y="299" text-anchor="middle" class="small">按项目</text><rect x="370" y="268" width="150" height="52" fill="#EAF7F4" stroke="#1C9C8C"/><text x="445.0" y="299" text-anchor="middle" class="small">可见</text><rect x="520" y="268" width="150" height="52" fill="#FFFFFF" stroke="#D7E0EA"/><text x="595.0" y="299" text-anchor="middle" class="small">受控</text><rect x="670" y="268" width="150" height="52" fill="#EAF7F4" stroke="#1C9C8C"/><text x="745.0" y="299" text-anchor="middle" class="small">可见</text><rect x="70" y="320" width="150" height="52" fill="#F7F9FC" stroke="#D7E0EA"/><text x="145.0" y="351" text-anchor="middle" class="small">质量/客诉</text><rect x="220" y="320" width="150" height="52" fill="#EAF7F4" stroke="#1C9C8C"/><text x="295.0" y="351" text-anchor="middle" class="small">可见</text><rect x="370" y="320" width="150" height="52" fill="#EAF7F4" stroke="#1C9C8C"/><text x="445.0" y="351" text-anchor="middle" class="small">可见</text><rect x="520" y="320" width="150" height="52" fill="#EAF7F4" stroke="#1C9C8C"/><text x="595.0" y="351" text-anchor="middle" class="small">可见</text><rect x="670" y="320" width="150" height="52" fill="#EAF7F4" stroke="#1C9C8C"/><text x="745.0" y="351" text-anchor="middle" class="small">可见</text><rect x="70" y="372" width="150" height="52" fill="#F7F9FC" stroke="#D7E0EA"/><text x="145.0" y="403" text-anchor="middle" class="small">经营/人事</text><rect x="220" y="372" width="150" height="52" fill="#FFF0F0" stroke="#D95C5C"/><text x="295.0" y="403" text-anchor="middle" class="small">不可见</text><rect x="370" y="372" width="150" height="52" fill="#FFF0F0" stroke="#D95C5C"/><text x="445.0" y="403" text-anchor="middle" class="small">不可见</text><rect x="520" y="372" width="150" height="52" fill="#FFF7DF" stroke="#C56A25"/><text x="595.0" y="403" text-anchor="middle" class="small">需审批</text><rect x="670" y="372" width="150" height="52" fill="#EAF7F4" stroke="#1C9C8C"/><text x="745.0" y="403" text-anchor="middle" class="small">可见</text><text x="70" y="455" class="tiny" fill="#526173">表格表达访问边界；具体岗位授权、客户要求和资料分级以正式文件为准。</text><rect x="820" y="455" width="390" height="145" rx="8" fill="#FFFFFF" stroke="#D7E0EA"/><text x="845" y="484" class="label">权限控制闭环</text><rect x="840" y="515" width="74" height="38" rx="7" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/><text x="877" y="539" text-anchor="middle" class="tiny">申请</text><line x1="914" y1="534" x2="926" y2="534" stroke="#2F6BFF" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="928" y="515" width="74" height="38" rx="7" fill="#FFFFFF" stroke="#C56A25" stroke-width="2"/><text x="965" y="539" text-anchor="middle" class="tiny">批准</text><line x1="1002" y1="534" x2="1014" y2="534" stroke="#C56A25" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1016" y="515" width="74" height="38" rx="7" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="2"/><text x="1053" y="539" text-anchor="middle" class="tiny">使用留痕</text><line x1="1090" y1="534" x2="1102" y2="534" stroke="#1C9C8C" stroke-width="2" marker-end="url(#arrowBlue)"/><rect x="1104" y="515" width="74" height="38" rx="7" fill="#FFFFFF" stroke="#D95C5C" stroke-width="2"/><text x="1141" y="539" text-anchor="middle" class="tiny">复核/回收</text><path d="M1110 555 C1110 590,900 590,900 553" fill="none" stroke="#D95C5C" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/><text x="1000" y="590" class="tiny" text-anchor="middle" fill="#D95C5C">离岗/异常：立即回收并上报</text>
