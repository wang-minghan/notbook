<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/><text x="60" y="68" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1C9C8C">29 / GOVERNANCE</text><text x="60" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="40" font-weight="bold" fill="#1F2D3D">内部检查与管理评审</text><text x="60" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#526173">按过程检查证据，再由管理评审形成决策和改进</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/><g id="main-content" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><rect x="90" y="280" width="180" height="110" rx="16" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="180" y="325" font-size="19" font-weight="bold" fill="#2F6BFF">01 制定计划</text><text x="180" y="355" font-size="14" fill="#526173">范围｜过程｜证据</text><rect x="330" y="280" width="180" height="110" rx="16" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="420" y="325" font-size="19" font-weight="bold" fill="#7657B8">02 过程检查</text><text x="420" y="355" font-size="14" fill="#526173">现场｜记录｜访谈</text><rect x="570" y="280" width="180" height="110" rx="16" fill="#FFFFFF" stroke="#D95C5C" stroke-width="3"/><text x="660" y="325" font-size="19" font-weight="bold" fill="#B84747">03 发现分级</text><text x="660" y="355" font-size="14" fill="#526173">事实｜风险｜整改</text><rect x="810" y="280" width="180" height="110" rx="16" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="900" y="325" font-size="19" font-weight="bold" fill="#C56A25">04 管理评审</text><text x="900" y="355" font-size="14" fill="#526173">输入｜决策｜资源</text><rect x="1050" y="280" width="150" height="110" rx="16" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="1125" y="325" font-size="19" font-weight="bold" fill="#1C9C8C">05 跟踪</text><text x="1125" y="355" font-size="14" fill="#526173">关闭证据</text></g><path d="M270 335 H330 M510 335 H570 M750 335 H810 M990 335 H1050" stroke="#8091A5" stroke-width="4" marker-end="url(#a)"/><path d="M1125 390 C1125 500 250 520 180 390" fill="none" stroke="#1C9C8C" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="460" y="520" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#1C9C8C">跟踪结果进入下一轮检查与评审</text><text x="90" y="600" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#A87519">管理评审输入、输出和频次：待确认，以正式机制为准</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">鑫犇电子有限公司｜公司治理与管理方法</text><text x="1220" y="690" text-anchor="end" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">29</text><defs><marker id="a" markerWidth="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8091A5"/></marker></defs></svg>