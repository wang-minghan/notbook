<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#9AA9BA" /></marker><filter id="f"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#AAB7C6" flood-opacity=".22" /></filter></defs><rect width="1280" height="720" fill="#F7F9FC" /><rect width="1280" height="8" fill="#2F6BFF" />
<text x="60" y="62" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#1C9C8C">34 / IMPLEMENTATION ROADMAP</text><text x="60" y="108" font-family="Microsoft YaHei,Arial" font-size="38" font-weight="700" fill="#1F2D3D">90天落地路线</text><text x="60" y="140" font-family="Microsoft YaHei,Arial" font-size="17" fill="#526173">先跑通关键责任、授权和记录，再扩展到全公司</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA" />
<line x1="150" y1="360" x2="1130" y2="360" stroke="#9AA9BA" stroke-width="5" marker-end="url(#m)" /><circle cx="190" cy="360" r="18" fill="#2F6BFF" /><circle cx="640" cy="360" r="18" fill="#1C9C8C" /><circle cx="1090" cy="360" r="18" fill="#C56A25" />
<g filter="url(#f)" id="obj_34_90天落地路线_1"><path fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2" d="M98,205 H392 A18,18 0 0 1 410,223 V417 A18,18 0 0 1 392,435 H98 A18,18 0 0 1 80,417 V223 A18,18 0 0 1 98,205 Z" /><path fill="#2F6BFF" d="M86,205 H404 A6,6 0 0 1 410,211 V211 A6,6 0 0 1 404,217 H86 A6,6 0 0 1 80,211 V211 A6,6 0 0 1 86,205 Z" /><text x="110" y="260" font-family="Microsoft YaHei,Arial" font-size="24" font-weight="700" fill="#2F6BFF">0—30天</text><text x="110" y="292" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#1F2D3D">确认主数据</text><text x="110" y="330" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 组织、岗位和授权人</text><text x="110" y="358" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 关键流程输入与输出</text><text x="110" y="386" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 记录、版本和待确认项</text><text x="110" y="415" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#2F6BFF">阶段门：责任基线确认</text></g>
<g filter="url(#f)" id="obj_34_90天落地路线_2"><path fill="#FFFFFF" stroke="#1C9C8C" stroke-width="2" d="M493,205 H787 A18,18 0 0 1 805,223 V417 A18,18 0 0 1 787,435 H493 A18,18 0 0 1 475,417 V223 A18,18 0 0 1 493,205 Z" /><path fill="#1C9C8C" d="M481,205 H799 A6,6 0 0 1 805,211 V211 A6,6 0 0 1 799,217 H481 A6,6 0 0 1 475,211 V211 A6,6 0 0 1 481,205 Z" /><text x="505" y="260" font-family="Microsoft YaHei,Arial" font-size="24" font-weight="700" fill="#1C9C8C">31—60天</text><text x="505" y="292" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#1F2D3D">关键流程试运行</text><text x="505" y="330" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 订单、变更、质量异常</text><text x="505" y="358" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 采购、交接和会议闭环</text><text x="505" y="386" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 记录样例与问题复盘</text><text x="505" y="415" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#1C9C8C">阶段门：试运行评审</text></g>
<g filter="url(#f)" id="obj_34_90天落地路线_3"><path fill="#FFFFFF" stroke="#C56A25" stroke-width="2" d="M888,205 H1182 A18,18 0 0 1 1200,223 V417 A18,18 0 0 1 1182,435 H888 A18,18 0 0 1 870,417 V223 A18,18 0 0 1 888,205 Z" /><path fill="#C56A25" d="M876,205 H1194 A6,6 0 0 1 1200,211 V211 A6,6 0 0 1 1194,217 H876 A6,6 0 0 1 870,211 V211 A6,6 0 0 1 876,205 Z" /><text x="900" y="260" font-family="Microsoft YaHei,Arial" font-size="24" font-weight="700" fill="#C56A25">61—90天</text><text x="900" y="292" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#1F2D3D">复盘与固化</text><text x="900" y="330" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 根据结果修订制度和表单</text><text x="900" y="358" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 明确培训、授权和检查机制</text><text x="900" y="386" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 形成下一轮改进计划</text><text x="900" y="415" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#C56A25">阶段门：正式发布前批准</text></g>
<path fill="#FFF7DF" stroke="#E8D39A" d="M199,525 H1081 A29,29 0 0 1 1110,554 V554 A29,29 0 0 1 1081,583 H199 A29,29 0 0 1 170,554 V554 A29,29 0 0 1 199,525 Z" /><text x="640" y="561" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" font-weight="700" fill="#805B12">本路线是建议机制，不代表公司已经完成实施；每个阶段以实际确认、试运行记录和批准结果为准</text><text x="60" y="692" font-family="Microsoft YaHei,Arial" font-size="12" fill="#8A97A8">路线不是项目承诺书：责任人、日期、范围和验收标准须在公司确认后冻结</text></svg>