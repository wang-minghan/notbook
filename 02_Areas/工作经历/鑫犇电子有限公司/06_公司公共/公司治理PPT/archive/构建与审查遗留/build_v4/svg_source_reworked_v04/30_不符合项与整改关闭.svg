<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
 <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2F6BFF"/></marker>
 <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D95C5C"/></marker>
 <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1C9C8C"/></marker>
 <style>text{font-family:'Microsoft YaHei','Arial',sans-serif;fill:#1F2D3D}.title{font-size:30px;font-weight:700}.sub{font-size:14px;fill:#526173}.label{font-size:13px;font-weight:700}.small{font-size:12px}.tiny{font-size:11px}</style>
</defs><rect width="1280" height="720" fill="#F7F9FC"/>
<text x="52" y="48" class="title">30｜不符合项与整改关闭</text><text x="52" y="75" class="sub">登记—升级—找根因—措施—验证—关闭，并保留失败回路</text>
<text x="52" y="116" class="small" fill="#526173">不符合项不能只记录“已整改”；必须证明原因、措施、验证有效并控制复发</text><rect x="58" y="230" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="208" y="268" text-anchor="middle" class="label">01 发现登记</text><text x="208" y="298" text-anchor="middle" class="small" fill="#526173">事实｜证据｜来源</text><line x1="358" y1="280" x2="44" y2="450" stroke="#2F6BFF" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="58" y="400" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="208" y="438" text-anchor="middle" class="label">02 分级升级</text><text x="208" y="468" text-anchor="middle" class="small" fill="#526173">风险｜责任｜期限</text><line x1="208" y1="500" x2="598" y2="216" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="448" y="230" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="598" y="268" text-anchor="middle" class="label">03 原因分析</text><text x="598" y="298" text-anchor="middle" class="small" fill="#526173">根因｜复发控制</text><line x1="748" y1="280" x2="434" y2="450" stroke="#7657B8" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="448" y="400" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="598" y="438" text-anchor="middle" class="label">04 制定措施</text><text x="598" y="468" text-anchor="middle" class="small" fill="#526173">责任｜期限｜记录</text><line x1="598" y1="500" x2="988" y2="216" stroke="#1C9C8C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="838" y="230" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="988" y="268" text-anchor="middle" class="label">05 效果验证</text><text x="988" y="298" text-anchor="middle" class="small" fill="#526173">证据｜有效性</text><line x1="1138" y1="280" x2="824" y2="450" stroke="#1C9C8C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="838" y="400" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="988" y="438" text-anchor="middle" class="label">06 关闭</text><text x="988" y="468" text-anchor="middle" class="small" fill="#526173">批准｜留痕</text><path d="M1100 400 C1180 430,1180 570,1010 570 C860 570,760 530,760 430" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/><text x="1000" y="610" text-anchor="middle" class="small" fill="#D95C5C">验证失败 / 逾期 / 复发：再升级，不直接关闭</text><rect x="58" y="555" width="650" height="55" rx="7" fill="#FFF7DF" stroke="#E8D39A"/><text x="383" y="588" text-anchor="middle" class="tiny" fill="#A87519">责任岗位、整改期限和关闭权限：待正式授权文件确认</text>
<line x1="52" y1="680" x2="1228" y2="680" stroke="#D7E0EA"/><text x="52" y="704" class="tiny" fill="#526173">鑫犇电子｜治理体系草案｜图形原型，待正式流程/授权文件确认</text><text x="1190" y="704" class="tiny" fill="#526173">DRAFT</text></svg>