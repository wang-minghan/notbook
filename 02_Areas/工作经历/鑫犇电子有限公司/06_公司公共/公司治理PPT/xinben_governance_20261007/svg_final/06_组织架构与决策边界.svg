<text x="60" y="62" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#1C9C8C">06 / GOVERNANCE · ORGANIZATION</text><text x="60" y="108" font-family="Microsoft YaHei,Arial" font-size="38" font-weight="700" fill="#1F2D3D">组织架构与决策边界</text><text x="60" y="140" font-family="Microsoft YaHei,Arial" font-size="17" fill="#526173">组织图表达责任传递，不把岗位名单误当成治理机制</text>
