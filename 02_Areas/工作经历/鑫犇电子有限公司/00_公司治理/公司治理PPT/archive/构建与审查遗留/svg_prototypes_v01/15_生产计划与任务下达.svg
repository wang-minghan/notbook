<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
 <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2F6BFF"/></marker>
 <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D95C5C"/></marker>
 <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1C9C8C"/></marker>
 <style>text{font-family:'Microsoft YaHei','Arial',sans-serif;fill:#1F2D3D}.title{font-size:30px;font-weight:700}.sub{font-size:14px;fill:#526173}.label{font-size:13px;font-weight:700}.small{font-size:12px}.tiny{font-size:11px}</style>
</defs><rect width="1280" height="720" fill="#F7F9FC"/>
<text x="52" y="48" class="title">15｜生产计划与任务下达</text><text x="52" y="75" class="sub">订单输入—能力确认—开工闸口—任务发布，并保留资源不足回路</text>
<text x="52" y="116" class="small" fill="#526173">先确认订单输入和资源能力，再经过开工决策闸口；条件不足不得直接开工</text><rect x="70" y="240" width="220" height="120" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="180" y="282" text-anchor="middle" class="label">订单输入</text><text x="180" y="320" text-anchor="middle" class="tiny" fill="#526173">产品｜数量｜交期｜版本</text><line x1="290" y1="300" x2="332" y2="300" stroke="#2F6BFF" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="350" y="240" width="220" height="120" rx="10" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="460" y="282" text-anchor="middle" class="label">能力确认</text><text x="460" y="320" text-anchor="middle" class="tiny" fill="#526173">产能｜物料｜模具｜人员</text><line x1="570" y1="300" x2="612" y2="300" stroke="#1C9C8C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="630" y="240" width="220" height="120" rx="10" fill="#FFFFFF" stroke="#A87519" stroke-width="3"/><text x="740" y="282" text-anchor="middle" class="label">风险清单</text><text x="740" y="320" text-anchor="middle" class="tiny" fill="#526173">缺口｜责任｜补充期限</text><line x1="850" y1="300" x2="892" y2="300" stroke="#A87519" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="910" y="240" width="220" height="120" rx="10" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="1020" y="282" text-anchor="middle" class="label">任务发布</text><text x="1020" y="320" text-anchor="middle" class="tiny" fill="#526173">受控版本｜责任｜节点</text><polygon points="520,190 570,240 520,290 470,240" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="520" y="237" text-anchor="middle" class="tiny">条件</text><text x="520" y="252" text-anchor="middle" class="tiny">满足？</text><line x1="460" y1="300" x2="470" y2="240" stroke="#1C9C8C" stroke-width="3" marker-end="url(#arrowBlue)"/><path d="M520 290 C520 430,700 480,740 360" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/><text x="620" y="470" text-anchor="middle" class="small" fill="#D95C5C">否：形成风险清单，补充资源或升级承诺</text><rect x="95" y="530" width="1090" height="60" rx="8" fill="#FFF7DF" stroke="#E8D39A"/><text x="640" y="566" text-anchor="middle" class="label" fill="#A87519">任务发布前必须完成能力确认；交期承诺不能绕过资源与版本检查</text>
<line x1="52" y1="680" x2="1228" y2="680" stroke="#D7E0EA"/><text x="52" y="704" class="tiny" fill="#526173">鑫犇电子｜治理体系草案｜图形原型，待正式流程/授权文件确认</text><text x="1190" y="704" class="tiny" fill="#526173">DRAFT</text></svg>