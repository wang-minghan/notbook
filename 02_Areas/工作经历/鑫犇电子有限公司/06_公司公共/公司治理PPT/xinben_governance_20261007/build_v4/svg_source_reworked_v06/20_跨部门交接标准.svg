<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
 <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2F6BFF"/></marker>
 <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D95C5C"/></marker>
 <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1C9C8C"/></marker>
 <style>text{font-family:'Microsoft YaHei','Arial',sans-serif;fill:#1F2D3D}.title{font-size:30px;font-weight:700}.sub{font-size:14px;fill:#526173}.label{font-size:13px;font-weight:700}.small{font-size:12px}.tiny{font-size:11px}</style>
</defs><rect width="1280" height="720" fill="#F7F9FC"/>
<text x="52" y="48" class="title">20｜跨部门交接标准</text><text x="52" y="75" class="sub">用输入包—完整性闸口—验收包—受控执行表达责任转移</text>
<text x="52" y="116" class="small" fill="#526173">交接只有在完整性闸口通过后才进入下一部门；缺项或版本不一致必须退回</text><rect x="70" y="220" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="185" y="255" text-anchor="middle" class="label">交出方</text><text x="185" y="290" text-anchor="middle" class="small" fill="#2F6BFF">输入包</text><text x="185" y="325" text-anchor="middle" class="tiny" fill="#526173">版本 / 数量 / 状态 / 期限</text><line x1="300" y1="295" x2="334" y2="295" stroke="#2F6BFF" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="350" y="220" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="465" y="255" text-anchor="middle" class="label">完整性闸口</text><text x="465" y="290" text-anchor="middle" class="small" fill="#C56A25">四项检查</text><text x="465" y="325" text-anchor="middle" class="tiny" fill="#526173">资料齐全｜版本一致｜责任期限｜验收标准</text><line x1="580" y1="295" x2="634" y2="295" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="650" y="220" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="765" y="255" text-anchor="middle" class="label">接收方</text><text x="765" y="290" text-anchor="middle" class="small" fill="#1C9C8C">验收包</text><text x="765" y="325" text-anchor="middle" class="tiny" fill="#526173">确认 / 差异记录 / 受控任务</text><line x1="880" y1="295" x2="934" y2="295" stroke="#1C9C8C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="950" y="220" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="1065" y="255" text-anchor="middle" class="label">受控执行</text><text x="1065" y="290" text-anchor="middle" class="small" fill="#7657B8">责任承接</text><text x="1065" y="325" text-anchor="middle" class="tiny" fill="#526173">异常升级 / 截止日期 / 输出证据</text><path d="M465 370 C430 480,250 500,220 370" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/><text x="325" y="500" text-anchor="middle" class="small" fill="#D95C5C">缺项 / 版本不一致：退回补齐</text><rect x="80" y="145" width="1120" height="48" rx="8" fill="#EAF0FF" stroke="#B7C9FF"/><text x="640" y="175" text-anchor="middle" class="label" fill="#2F6BFF">交接证据：清单、版本号、接收确认、差异记录、责任人、截止日期、异常升级记录</text>
<line x1="52" y1="680" x2="1228" y2="680" stroke="#D7E0EA"/><text x="52" y="704" class="tiny" fill="#526173">鑫犇电子｜治理体系草案｜图形原型，待正式流程/授权文件确认</text><text x="1190" y="704" class="tiny" fill="#526173">DRAFT</text></svg>