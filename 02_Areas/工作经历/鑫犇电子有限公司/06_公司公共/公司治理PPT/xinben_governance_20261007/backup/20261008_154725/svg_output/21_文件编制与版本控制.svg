<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6B7A90"/></marker></defs><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/><text x="60" y="62" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#1C9C8C">21 / GOVERNANCE · DOCUMENT CONTROL</text><text x="60" y="108" font-family="Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="700" fill="#1F2D3D">文件编制与版本控制</text><text x="60" y="140" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526173">新版本必须可追溯，旧版本必须被隔离</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/><path d="M230 320 C230 220 390 205 470 270 C540 325 560 390 640 390 C720 390 740 325 810 270 C890 205 1050 220 1050 320 C1050 420 890 435 810 370 C740 315 720 250 640 250 C560 250 540 315 470 370 C390 435 230 420 230 320Z" fill="none" stroke="#2F6BFF" stroke-width="5" marker-end="url(#a)"/><g id="group_21_文件编制与版本控制_labels" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><rect x="145" y="285" width="170" height="70" rx="14" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="2"/><text x="230" y="315" font-size="16" font-weight="700" fill="#2F6BFF">起草</text><text x="230" y="338" font-size="12" fill="#526173">需求与版本号</text><rect x="390" y="215" width="170" height="70" rx="14" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="2"/><text x="475" y="245" font-size="16" font-weight="700" fill="#1C9C8C">评审</text><text x="475" y="268" font-size="12" fill="#526173">专业意见</text><rect x="555" y="365" width="170" height="70" rx="14" fill="#FFF2E7" stroke="#C56A25" stroke-width="2"/><text x="640" y="395" font-size="16" font-weight="700" fill="#C56A25">批准发布</text><text x="640" y="418" font-size="12" fill="#526173">受控清单</text><rect x="720" y="215" width="170" height="70" rx="14" fill="#EAF7F4" stroke="#1C9C8C" stroke-width="2"/><text x="805" y="245" font-size="16" font-weight="700" fill="#1C9C8C">执行与培训</text><text x="805" y="268" font-size="12" fill="#526173">使用记录</text><rect x="965" y="285" width="170" height="70" rx="14" fill="#F2ECFF" stroke="#7657B8" stroke-width="2"/><text x="1050" y="315" font-size="16" font-weight="700" fill="#7657B8">复审 / 修订</text><text x="1050" y="338" font-size="12" fill="#526173">触发新版本</text></g><rect x="925" y="470" width="250" height="100" rx="16" fill="#FFF0F0" stroke="#D95C5C" stroke-width="2"/><text x="1050" y="505" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#B84747">旧版本隔离 / 作废</text><text x="1050" y="535" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#526173">回收、标识、留痕</text><path d="M890 285 V470 H925" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><rect x="70" y="585" width="1100" height="48" rx="24" fill="#FFFFFF" stroke="#DCE4EE"/><text x="620" y="615" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526173">证据：版本清单 · 审批记录 · 发布通知 · 培训记录 · 旧版回收记录</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" fill="#8A97A8">主环＝受控文件生命周期　红色分支＝旧版隔离，不回流主流程</text></svg>