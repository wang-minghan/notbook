<text x="52" y="48" class="title">24｜客户资料与信息权限</text><text x="52" y="75" class="sub">权限矩阵与控制闭环：按需批准、使用留痕、变化即回收</text>
<text x="52" y="118" class="small" fill="#526173">权限矩阵只回答“谁可以做什么”；申请、批准、留痕和回收另列为控制闭环</text><rect x="58" y="170" width="180" height="48" fill="#EAF0FF" stroke="#D7E0EA"/><text x="148.0" y="200" text-anchor="middle" class="label">资料类型</text><rect x="238" y="170" width="180" height="48" fill="#EAF0FF" stroke="#D7E0EA"/><text x="328.0" y="200" text-anchor="middle" class="label">业务/营运</text><rect x="418" y="170" width="180" height="48" fill="#EAF0FF" stroke="#D7E0EA"/><text x="508.0" y="200" text-anchor="middle" class="label">技术/品质</text><rect x="598" y="170" width="180" height="48" fill="#EAF0FF" stroke="#D7E0EA"/><text x="688.0" y="200" text-anchor="middle" class="label">管理层</text><rect x="778" y="170" width="240" height="48" fill="#FFF7DF" stroke="#D7E0EA"/><text x="898.0" y="200" text-anchor="middle" class="label">控制动作</text><rect x="58" y="218" width="180" height="58" fill="#F7F9FC" stroke="#D7E0EA"/><text x="148.0" y="253" text-anchor="middle" class="small">报价 / 订单</text><rect x="238" y="218" width="180" height="58" fill="#EAF7F4" stroke="#1C9C8C"/><text x="328.0" y="253" text-anchor="middle" class="small">可见</text><rect x="418" y="218" width="180" height="58" fill="#FFF7DF" stroke="#C56A25"/><text x="508.0" y="253" text-anchor="middle" class="small">需审批</text><rect x="598" y="218" width="180" height="58" fill="#EAF7F4" stroke="#1C9C8C"/><text x="688.0" y="253" text-anchor="middle" class="small">可见</text><rect x="778" y="218" width="240" height="58" fill="#FFF7DF" stroke="#C56A25"/><text x="898.0" y="253" text-anchor="middle" class="small">申请→批准→留痕</text><rect x="58" y="276" width="180" height="58" fill="#F7F9FC" stroke="#D7E0EA"/><text x="148.0" y="311" text-anchor="middle" class="small">图纸 / 工艺</text><rect x="238" y="276" width="180" height="58" fill="#FFF7DF" stroke="#C56A25"/><text x="328.0" y="311" text-anchor="middle" class="small">按项目</text><rect x="418" y="276" width="180" height="58" fill="#EAF7F4" stroke="#1C9C8C"/><text x="508.0" y="311" text-anchor="middle" class="small">可见</text><rect x="598" y="276" width="180" height="58" fill="#EAF7F4" stroke="#1C9C8C"/><text x="688.0" y="311" text-anchor="middle" class="small">可见</text><rect x="778" y="276" width="240" height="58" fill="#FFF7DF" stroke="#C56A25"/><text x="898.0" y="311" text-anchor="middle" class="small">项目结束→复核</text><rect x="58" y="334" width="180" height="58" fill="#F7F9FC" stroke="#D7E0EA"/><text x="148.0" y="369" text-anchor="middle" class="small">质量 / 客诉</text><rect x="238" y="334" width="180" height="58" fill="#EAF7F4" stroke="#1C9C8C"/><text x="328.0" y="369" text-anchor="middle" class="small">可见</text><rect x="418" y="334" width="180" height="58" fill="#EAF7F4" stroke="#1C9C8C"/><text x="508.0" y="369" text-anchor="middle" class="small">可见</text><rect x="598" y="334" width="180" height="58" fill="#EAF7F4" stroke="#1C9C8C"/><text x="688.0" y="369" text-anchor="middle" class="small">可见</text><rect x="778" y="334" width="240" height="58" fill="#FFF7DF" stroke="#C56A25"/><text x="898.0" y="369" text-anchor="middle" class="small">异常→上报→关闭</text><rect x="58" y="392" width="180" height="58" fill="#F7F9FC" stroke="#D7E0EA"/><text x="148.0" y="427" text-anchor="middle" class="small">经营 / 人事</text><rect x="238" y="392" width="180" height="58" fill="#FFF0F0" stroke="#D95C5C"/><text x="328.0" y="427" text-anchor="middle" class="small">不可见</text><rect x="418" y="392" width="180" height="58" fill="#FFF0F0" stroke="#D95C5C"/><text x="508.0" y="427" text-anchor="middle" class="small">不可见</text><rect x="598" y="392" width="180" height="58" fill="#EAF7F4" stroke="#1C9C8C"/><text x="688.0" y="427" text-anchor="middle" class="small">可见</text><rect x="778" y="392" width="240" height="58" fill="#FFF7DF" stroke="#C56A25"/><text x="898.0" y="427" text-anchor="middle" class="small">离岗→立即回收</text><rect x="58" y="475" width="1170" height="118" rx="8" fill="#FFFFFF" stroke="#D7E0EA"/><text x="82" y="505" class="label">权限控制闭环：四个动作对应矩阵中的每一次权限变化</text><rect x="82" y="530" width="220" height="42" rx="7" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/><text x="192" y="548" text-anchor="middle" class="small">1 申请</text><text x="192" y="565" text-anchor="middle" class="tiny" fill="#526173">说明业务需要</text><line x1="302" y1="551" x2="352" y2="551" stroke="#2F6BFF" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="362" y="530" width="220" height="42" rx="7" fill="#FFFFFF" stroke="#C56A25" stroke-width="2"/><text x="472" y="548" text-anchor="middle" class="small">2 批准</text><text x="472" y="565" text-anchor="middle" class="tiny" fill="#526173">最小必要权限</text><line x1="582" y1="551" x2="632" y2="551" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="642" y="530" width="220" height="42" rx="7" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="2"/><text x="752" y="548" text-anchor="middle" class="small">3 使用留痕</text><text x="752" y="565" text-anchor="middle" class="tiny" fill="#526173">访问可追溯</text><line x1="862" y1="551" x2="912" y2="551" stroke="#1C9C8C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="922" y="530" width="220" height="42" rx="7" fill="#FFFFFF" stroke="#D95C5C" stroke-width="2"/><text x="1032" y="548" text-anchor="middle" class="small">4 复核/回收</text><text x="1032" y="565" text-anchor="middle" class="tiny" fill="#526173">岗位变化或异常立即处理</text>
<line x1="52" y1="680" x2="1228" y2="680" stroke="#D7E0EA"/><text x="52" y="704" class="tiny" fill="#526173">鑫犇电子｜治理体系草案｜图形原型，待正式流程/授权文件确认</text><text x="1190" y="704" class="tiny" fill="#526173">DRAFT</text></svg>