<g id="header">
 <text x="60" y="58" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#1C9C8C">PROCESS GOVERNANCE / 01</text>
 <text x="60" y="102" font-family="Microsoft YaHei,Arial,sans-serif" font-size="34" font-weight="700" fill="#1F2D3D">订单到交付总流程：把客户承诺变成可交付计划</text>
 <text x="60" y="133" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526173">流程重点不是“谁来做”，而是每个承诺都有确认、授权、记录和关闭证据</text>
