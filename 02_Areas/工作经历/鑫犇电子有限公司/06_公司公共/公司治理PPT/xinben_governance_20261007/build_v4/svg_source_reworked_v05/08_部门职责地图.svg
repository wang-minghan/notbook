 YaHei,Arial" font-size="12" font-weight="400" fill="#1C9C8C">接口：跨部门人员/保障协同</text><text x="778" y="483" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="10" font-weight="400" fill="#526173">人事组 / 后勤组</text><rect x="996" y="190" width="218" height="342" rx="14" fill="#FFFFFF" stroke="#C56A25" stroke-width="2"/><text x="1105" y="225" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#C56A25">财务部</text><line x1="1014" y1="240" x2="1196" y2="240" stroke="#D7E0EA"/><text x="1012" y="275" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12" font-weight="400" fill="#526173">输入：业务单据、费用/付款申请、经营数据</text><text x="1012" y="345" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12" font-weight="400" fill="#1F2D3D">输出：会计凭证、报表、资金与付款记录</text><text x="1012" y="415" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12" font-weight="400" fill="#C56A25">接口：财务审核/执行；审批依授权边界</text><text x="1012" y="483" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="10" font-weight="400" fill="#526173">会计组 / 出纳组</text><rect x="60" y="555" width="1160" height="78" rx="12" fill="#FFF7DF" stroke="#A87519" stroke-width="2"/><text x="640" y="583" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#805B12">正式事实：五部门及下属组织名称/归属依受控矩阵；输入输出为职责地图摘要，不替代SOP。</text><text x="640" y="610" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" font-weight="400" fill="#805B12">待确认边界：具体时限、金额阈值、岗位替代与例外授权以正式制度/授权文件为准。</text><text x="60" y="692" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12" font-weight="400" fill="#8A97A8">依据：受控组织矩阵、review_report.md；OneDrive 修正版草稿</text></svg>