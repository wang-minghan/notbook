<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
 <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#8091A5"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#D95C5C"/></marker>
 <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#AAB7C6" flood-opacity=".22"/></filter>
</defs>
<rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/>
<text x="60" y="68" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#1C9C8C">12 / GOVERNANCE</text>
<text x="60" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="40" font-weight="700" fill="#1F2D3D">越权与职责冲突处理</text>
<text x="60" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#526173">先暂停、再升级、后决定、留痕关闭；冲突不能沿着原路径继续推进</text>
<line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/>
<g id="obj_12_exception_loop">
 <path d="M250 305 C250 235 350 205 430 205 H850 C950 205 1030 260 1030 350 C1030 445 950 505 850 505 H430 C330 505 250 445 250 365" fill="none" stroke="#8091A5" stroke-width="5" marker-end="url(#arrow-gray)"/>
 <path d="M430 505 C330 505 250 445 250 365" fill="none" stroke="#D95C5C" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#arrow-red)"/>
 <g filter="url(#shadow)"><rect x="145" y="270" width="210" height="100" rx="18" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/><text x="250" y="305" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#E27A21" font-weight="700">01</text><text x="250" y="338" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="22" fill="#1F2D3D" font-weight="700">发现冲突</text><text x="250" y="360" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">事实、授权、责任不一致</text></g>
 <g filter="url(#shadow)"><rect x="390" y="155" width="220" height="100" rx="18" fill="#FFF0F0" stroke="#D95C5C" stroke-width="2"/><text x="500" y="190" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#D95C5C" font-weight="700">02</text><text x="500" y="223" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="22" fill="#1F2D3D" font-weight="700">暂停动作</text><text x="500" y="245" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">先隔离，不继续越权执行</text></g>
 <g filter="url(#shadow)"><rect x="670" y="155" width="220" height="100" rx="18" fill="#FFF7DF" stroke="#D79A2B" stroke-width="2"/><text x="780" y="190" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#805B12" font-weight="700">03</text><text x="780" y="223" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="22" fill="#1F2D3D" font-weight="700">升级判定</text><text x="780" y="245" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">提交事实与影响范围</text></g>
 <g filter="url(#shadow)"><rect x="850" y="300" width="220" height="100" rx="18" fill="#FFF2E7" stroke="#C56A25" stroke-width="2"/><text x="960" y="335" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#C56A25" font-weight="700">04</text><text x="960" y="368" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="22" fill="#1F2D3D" font-weight="700">授权决定</text><text x="960" y="390" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">明确责任与处理边界</text></g>
 <g filter="url(#shadow)"><rect x="570" y="455" width="220" height="100" rx="18" fill="#EAF7F4" stroke="#1C9C8C" stroke-width="2"/><text x="680" y="490" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1C9C8C" font-weight="700">05</text><text x="680" y="523" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="22" fill="#1F2D3D" font-weight="700">留痕关闭</text><text x="680" y="545" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">记录决定、验证结果和复盘</text></g>
 <path d="M355 320 H390" stroke="#8091A5" stroke-width="4" marker-end="url(#arrow-gray)"/><path d="M610 205 H670" stroke="#8091A5" stroke-width="4" marker-end="url(#arrow-gray)"/><path d="M890 255 C930 270 950 285 960 300" fill="none" stroke="#8091A5" stroke-width="4" marker-end="url(#arrow-gray)"/><path d="M850 400 C810 435 770 455 790 480" fill="none" stroke="#8091A5" stroke-width="4" marker-end="url(#arrow-gray)"/>
</g>
<rect x="120" y="620" width="1040" height="44" rx="22" fill="#FFFFFF" stroke="#D7E0EA"/><text x="640" y="648" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="15" font-weight="700" fill="#526173">红色虚线＝退回或再升级　实线＝正常闭环　每次冲突必须留下事实、决定和验证证据</text>
<text x="60" y="692" font-family="Microsoft YaHei,Arial" font-size="12" fill="#8A97A8">任何未确认的权限，不得在流程图中被表达为既成授权</text>
</svg>