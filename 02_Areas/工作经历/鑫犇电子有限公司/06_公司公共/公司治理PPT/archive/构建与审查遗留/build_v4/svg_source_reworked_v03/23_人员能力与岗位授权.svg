<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6B7A90" /></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D95C5C" /></marker></defs><rect width="1280" height="720" fill="#F7F9FC" /><rect width="1280" height="8" fill="#2F6BFF" /><text x="60" y="62" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#1C9C8C">23 / GOVERNANCE · COMPETENCE &amp; AUTHORIZATION</text><text x="60" y="108" font-family="Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="700" fill="#1F2D3D">人员能力与岗位授权</text><text x="60" y="140" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526173">培训不等于授权：能力确认是权限打开前的闸门</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA" /><text x="90" y="225" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#7657B8">能力确认阶梯</text><path d="M110 510 H300 V450 H490 V390 H680 V330 H870" fill="none" stroke="#7657B8" stroke-width="5" marker-end="url(#a)" /><g id="group_23_人员能力与岗位授权_labels" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><path fill="#F2ECFF" stroke="#7657B8" d="M112,475 H258 A12,12 0 0 1 270,487 V525 A12,12 0 0 1 258,537 H112 A12,12 0 0 1 100,525 V487 A12,12 0 0 1 112,475 Z" /><text x="185" y="512" font-size="17" font-weight="700" fill="#7657B8">培训</text><path fill="#F2ECFF" stroke="#7657B8" d="M302,415 H448 A12,12 0 0 1 460,427 V465 A12,12 0 0 1 448,477 H302 A12,12 0 0 1 290,465 V427 A12,12 0 0 1 302,415 Z" /><text x="375" y="452" font-size="17" font-weight="700" fill="#7657B8">能力确认</text><path fill="#FFF2E7" stroke="#C56A25" d="M492,355 H638 A12,12 0 0 1 650,367 V405 A12,12 0 0 1 638,417 H492 A12,12 0 0 1 480,405 V367 A12,12 0 0 1 492,355 Z" /><text x="565" y="392" font-size="17" font-weight="700" fill="#C56A25">岗位授权</text><path fill="#EAF7F4" stroke="#1C9C8C" d="M682,295 H828 A12,12 0 0 1 840,307 V345 A12,12 0 0 1 828,357 H682 A12,12 0 0 1 670,345 V307 A12,12 0 0 1 682,295 Z" /><text x="755" y="332" font-size="17" font-weight="700" fill="#1C9C8C">授权记录</text></g><path fill="#FFFFFF" stroke="#DCE4EE" d="M116,570 H844 A26,26 0 0 1 870,596 V596 A26,26 0 0 1 844,622 H116 A26,26 0 0 1 90,596 V596 A26,26 0 0 1 116,570 Z" /><text x="480" y="602" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526173">每一级都要有证据：培训记录 · 评价结果 · 授权批准 · 复核日期</text><text x="930" y="225" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1C9C8C">授权生命周期</text><path fill="#FFFFFF" stroke="#1C9C8C" stroke-width="2" d="M918,260 H1152 A18,18 0 0 1 1170,278 V492 A18,18 0 0 1 1152,510 H918 A18,18 0 0 1 900,492 V278 A18,18 0 0 1 918,260 Z" /><path d="M1035 300 C1110 300 1140 350 1110 400 C1080 450 990 450 960 400 C930 350 960 300 1035 300Z" fill="none" stroke="#1C9C8C" stroke-width="4" marker-end="url(#a)" /><text x="1035" y="350" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#1C9C8C">维护与复核</text><text x="1035" y="390" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526173">复训 / 调岗 / 替代</text><text x="1035" y="430" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526173">失效时暂停</text><path d="M1035 510 V555 H700" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)" /><text x="1040" y="545" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#B84747">离岗 / 不合格：回收权限</text><path fill="#FFF7DF" stroke="#A87519" stroke-width="2" d="M106,260 H344 A16,16 0 0 1 360,276 V354 A16,16 0 0 1 344,370 H106 A16,16 0 0 1 90,354 V276 A16,16 0 0 1 106,260 Z" /><text x="225" y="300" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#A87519">能力闸门</text><text x="225" y="335" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526173">未确认能力 → 不得授权</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" fill="#8A97A8">紫色＝能力判断　橙色＝授权　青绿色＝有效维护　红色虚线＝暂停/回收</text></svg>