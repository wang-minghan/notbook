<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/><text x="60" y="62" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#1C9C8C">32 / GOVERNANCE · RACI EXAMPLE</text><text x="60" y="108" font-family="Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="700" fill="#1F2D3D">部门协同 RACI 示例</text><text x="60" y="140" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526173">先用关键事项校准责任，再扩展到完整矩阵（示例，最终以正式授权为准）</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/><rect x="60" y="205" width="830" height="360" rx="14" fill="#FFFFFF" stroke="#D7E0EA"/><g id="group_32_部门协同RACI示例_labels" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><rect x="60" y="205" width="830" height="52" fill="#EAF0FF"/><text x="180" y="238" font-size="15" font-weight="700" fill="#1F2D3D">关键事项</text><text x="285" y="238" font-size="14" font-weight="700" fill="#2F6BFF">营运部</text><text x="385" y="238" font-size="14" font-weight="700" fill="#7657B8">技术/工程</text><text x="485" y="238" font-size="14" font-weight="700" fill="#1C9C8C">品质</text><text x="585" y="238" font-size="14" font-weight="700" fill="#C56A25">生产</text><text x="685" y="238" font-size="14" font-weight="700" fill="#A87519">采购/仓储</text><text x="785" y="238" font-size="14" font-weight="700" fill="#526173">管理层</text></g><g id="group_32_部门协同RACI示例_secondary" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#1F2D3D"><line x1="60" y1="257" x2="890" y2="257" stroke="#D7E0EA"/><line x1="60" y1="308" x2="890" y2="308" stroke="#D7E0EA"/><line x1="60" y1="359" x2="890" y2="359" stroke="#D7E0EA"/><line x1="60" y1="410" x2="890" y2="410" stroke="#D7E0EA"/><line x1="60" y1="461" x2="890" y2="461" stroke="#D7E0EA"/><line x1="60" y1="512" x2="890" y2="512" stroke="#D7E0EA"/><line x1="250" y1="205" x2="250" y2="565" stroke="#D7E0EA"/><line x1="320" y1="205" x2="320" y2="565" stroke="#D7E0EA"/><line x1="420" y1="205" x2="420" y2="565" stroke="#D7E0EA"/><line x1="520" y1="205" x2="520" y2="565" stroke="#D7E0EA"/><line x1="620" y1="205" x2="620" y2="565" stroke="#D7E0EA"/><line x1="720" y1="205" x2="720" y2="565" stroke="#D7E0EA"/><text x="75" y="289">订单评审</text><text x="75" y="340">技术变更</text><text x="75" y="391">采购验收</text><text x="75" y="442">质量放行</text><text x="75" y="493">客诉关闭</text><text x="75" y="544">付款批准</text></g><g id="raci_group_1" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><rect x="270" y="270" width="40" height="28" rx="6" fill="#FFF2E7"/><text x="290" y="290" fill="#C56A25">A</text><rect x="330" y="270" width="40" height="28" rx="6" fill="#EAF7F4"/><text x="350" y="290" fill="#1C9C8C">R</text><rect x="430" y="270" width="40" height="28" rx="6" fill="#F2ECFF"/><text x="450" y="290" fill="#7657B8">C</text><rect x="730" y="270" width="40" height="28" rx="6" fill="#F2ECFF"/><text x="750" y="290" fill="#7657B8">I</text><rect x="330" y="321" width="40" height="28" rx="6" fill="#EAF7F4"/><text x="350" y="341" fill="#1C9C8C">R</text><rect x="430" y="321" width="40" height="28" rx="6" fill="#FFF2E7"/><text x="450" y="341" fill="#C56A25">A</text><rect x="530" y="321" width="40" height="28" rx="6" fill="#F2ECFF"/><text x="550" y="341" fill="#7657B8">C</text><rect x="730" y="321" width="40" height="28" rx="6" fill="#F2ECFF"/><text x="750" y="341" fill="#7657B8">I</text><rect x="630" y="372" width="40" height="28" rx="6" fill="#FFF2E7"/><text x="650" y="392" fill="#C56A25">A</text><rect x="730" y="372" width="40" height="28" rx="6" fill="#F2ECFF"/><text x="750" y="392" fill="#7657B8">C</text><rect x="530" y="423" width="40" height="28" rx="6" fill="#FFF2E7"/><text x="550" y="443" fill="#C56A25">A</text><rect x="430" y="423" width="40" height="28" rx="6" fill="#EAF7F4"/><text x="450" y="443" fill="#1C9C8C">R</text><rect x="430" y="474" width="40" height="28" rx="6" fill="#FFF2E7"/><text x="450" y="494" fill="#C56A25">A</text><rect x="350" y="474" width="40" height="28" rx="6" fill="#EAF7F4"/><text x="370" y="494" fill="#1C9C8C">R</text><rect x="750" y="525" width="40" height="28" rx="6" fill="#FFF2E7"/><text x="770" y="545" fill="#C56A25">A</text><rect x="650" y="525" width="40" height="28" rx="6" fill="#EAF7F4"/><text x="670" y="545" fill="#1C9C8C">R</text></g><rect x="930" y="205" width="270" height="360" rx="16" fill="#FFFFFF" stroke="#D7E0EA"/><text x="1065" y="245" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#2F6BFF">三条使用规则</text><text x="965" y="300" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#1F2D3D">A · 每行一个最终负责/批准主体</text><text x="965" y="360" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#1F2D3D">R · 对执行结果负责</text><text x="965" y="420" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#1F2D3D">C / I · 参与或知会，不能替代A</text><rect x="965" y="475" width="200" height="48" rx="12" fill="#FFF7DF"/><text x="1065" y="505" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#A87519">待确认：最终授权边界</text><text x="60" y="650" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#526173">图例：A＝Accountable 最终负责/批准　R＝Responsible 执行　C＝Consulted 征询　I＝Informed 知会</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" fill="#8A97A8">示例矩阵仅用于校准责任逻辑，不代表公司已正式发布的授权文件</text></svg>