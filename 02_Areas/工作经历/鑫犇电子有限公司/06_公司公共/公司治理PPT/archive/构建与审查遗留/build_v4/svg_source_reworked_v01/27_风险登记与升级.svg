<text x="52" y="48" class="title">27｜风险登记与升级</text><text x="52" y="75" class="sub">风险点先定位，再按编号直接映射到触发等级和责任层级</text>
<text x="72" y="130" class="label">风险热力图</text><text x="72" y="152" class="tiny" fill="#526173">横轴：可能性　纵轴：影响</text><rect x="92" y="352" width="54" height="54" fill="#EAF7F4" stroke="#FFFFFF"/><rect x="146" y="352" width="54" height="54" fill="#FFF7DF" stroke="#FFFFFF"/><rect x="200" y="352" width="54" height="54" fill="#FFF2E7" stroke="#FFFFFF"/><rect x="254" y="352" width="54" height="54" fill="#FFF0F0" stroke="#FFFFFF"/><rect x="92" y="298" width="54" height="54" fill="#FFF7DF" stroke="#FFFFFF"/><rect x="146" y="298" width="54" height="54" fill="#FFF2E7" stroke="#FFFFFF"/><rect x="200" y="298" width="54" height="54" fill="#FFF0F0" stroke="#FFFFFF"/><rect x="254" y="298" width="54" height="54" fill="#FFF0F0" stroke="#FFFFFF"/><rect x="92" y="244" width="54" height="54" fill="#FFF2E7" stroke="#FFFFFF"/><rect x="146" y="244" width="54" height="54" fill="#FFF0F0" stroke="#FFFFFF"/><rect x="200" y="244" width="54" height="54" fill="#FFF0F0" stroke="#FFFFFF"/><rect x="254" y="244" width="54" height="54" fill="#FFF0F0" stroke="#FFFFFF"/><rect x="92" y="190" width="54" height="54" fill="#FFF0F0" stroke="#FFFFFF"/><rect x="146" y="190" width="54" height="54" fill="#FFF0F0" stroke="#FFFFFF"/><rect x="200" y="190" width="54" height="54" fill="#FFF0F0" stroke="#FFFFFF"/><rect x="254" y="190" width="54" height="54" fill="#FFF0F0" stroke="#FFFFFF"/><text x="200" y="430" class="small" text-anchor="middle">可能性 →</text><text x="45" y="300" class="small" transform="rotate(-90 45 300)" text-anchor="middle">影响 ↑</text><circle cx="173.0" cy="325.0" r="17" fill="#A87519"/><text x="173.0" y="329.0" class="tiny" text-anchor="middle" fill="#FFFFFF">R-01</text><circle cx="227.0" cy="271.0" r="17" fill="#C56A25"/><text x="227.0" y="275.0" class="tiny" text-anchor="middle" fill="#FFFFFF">R-02</text><circle cx="281.0" cy="217.0" r="17" fill="#D95C5C"/><text x="281.0" y="221.0" class="tiny" text-anchor="middle" fill="#FFFFFF">R-03</text><rect x="78" y="455" width="248" height="78" rx="8" fill="#FFFFFF" stroke="#D7E0EA"/><text x="94" y="478" class="tiny" fill="#526173">颜色仅表示风险等级分区；</text><text x="94" y="498" class="tiny" fill="#526173">正式阈值、时限和岗位待确认。</text><text x="94" y="518" class="tiny" fill="#526173">编号用于右侧责任映射。</text><rect x="370" y="120" width="850" height="480" rx="10" fill="#FFFFFF" stroke="#D7E0EA"/><text x="400" y="158" class="label">风险编号 → 触发等级 → 责任层级</text><text x="400" y="184" class="tiny" fill="#526173">不使用长曲线推断；每个风险编号直接落到一条责任路径。</text><rect x="400" y="225" width="92" height="54" rx="8" fill="#A87519"/><text x="446" y="259" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#FFFFFF">R-01</text><line x1="500" y1="252" x2="535" y2="252" stroke="#A87519" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="545" y="225" width="110" height="54" rx="8" fill="#F7F9FC" stroke="#A87519" stroke-width="2"/><text x="600" y="259" text-anchor="middle" class="label">低/中</text><line x1="663" y1="252" x2="698" y2="252" stroke="#A87519" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="708" y="225" width="210" height="54" rx="8" fill="#FFFFFF" stroke="#A87519" stroke-width="2"/><text x="813" y="259" text-anchor="middle" class="label">业务线自处置</text><rect x="940" y="225" width="245" height="54" rx="8" fill="#EEF3F8" stroke="#D7E0EA"/><text x="952" y="248" class="tiny" fill="#526173">登记、设责任人、按期验证</text><text x="952" y="265" class="tiny" fill="#526173"></text><rect x="400" y="320" width="92" height="54" rx="8" fill="#C56A25"/><text x="446" y="354" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#FFFFFF">R-02</text><line x1="500" y1="347" x2="535" y2="347" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="545" y="320" width="110" height="54" rx="8" fill="#F7F9FC" stroke="#C56A25" stroke-width="2"/><text x="600" y="354" text-anchor="middle" class="label">中/高</text><line x1="663" y1="347" x2="698" y2="347" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="708" y="320" width="210" height="54" rx="8" fill="#FFFFFF" stroke="#C56A25" stroke-width="2"/><text x="813" y="354" text-anchor="middle" class="label">职能部门复核</text><rect x="940" y="320" width="245" height="54" rx="8" fill="#EEF3F8" stroke="#D7E0EA"/><text x="952" y="343" class="tiny" fill="#526173">评估影响、设期限、必要时升级</text><text x="952" y="360" class="tiny" fill="#526173"></text><rect x="400" y="415" width="92" height="54" rx="8" fill="#D95C5C"/><text x="446" y="449" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#FFFFFF">R-03</text><line x1="500" y1="442" x2="535" y2="442" stroke="#D95C5C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="545" y="415" width="110" height="54" rx="8" fill="#F7F9FC" stroke="#D95C5C" stroke-width="2"/><text x="600" y="449" text-anchor="middle" class="label">高</text><line x1="663" y1="442" x2="698" y2="442" stroke="#D95C5C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="708" y="415" width="210" height="54" rx="8" fill="#FFFFFF" stroke="#D95C5C" stroke-width="2"/><text x="813" y="449" text-anchor="middle" class="label">管理层介入</text><rect x="940" y="415" width="245" height="54" rx="8" fill="#EEF3F8" stroke="#D7E0EA"/><text x="952" y="438" class="tiny" fill="#526173">决策资源、确认措施、监督关闭</text><text x="952" y="455" class="tiny" fill="#526173"></text><path d="M918 510 C850 570,620 570,545 510" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/><text x="810" y="590" class="tiny" text-anchor="middle" fill="#D95C5C">验证失败：返回对应编号重新登记；验证通过：形成关闭证据</text>
<line x1="52" y1="680" x2="1228" y2="680" stroke="#D7E0EA"/><text x="52" y="704" class="tiny" fill="#526173">鑫犇电子｜治理体系草案｜图形原型，待正式流程/授权文件确认</text><text x="1190" y="704" class="tiny" fill="#526173">DRAFT</text></svg>