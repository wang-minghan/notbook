<text x="52" y="48" class="title">28｜安全、环保与应急</text><text x="52" y="75" class="sub">发现—处置—上报—调查—整改—验证，现场与管理层共同承接</text>
<text x="52" y="116" class="small" fill="#526173">现场先控制人身与环境风险，再按分级要求上报、调查、整改和验证</text><rect x="55" y="245" width="175" height="112" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="142.5" y="287" text-anchor="middle" class="label">01 发现</text><text x="142.5" y="320" text-anchor="middle" class="tiny" fill="#526173">检查 / 事件</text><line x1="230" y1="301" x2="249" y2="301" stroke="#2F6BFF" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="255" y="245" width="175" height="112" rx="10" fill="#FFFFFF" stroke="#D95C5C" stroke-width="3"/><text x="342.5" y="287" text-anchor="middle" class="label">02 现场处置</text><text x="342.5" y="320" text-anchor="middle" class="tiny" fill="#526173">隔离风险</text><line x1="430" y1="301" x2="449" y2="301" stroke="#D95C5C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="455" y="245" width="175" height="112" rx="10" fill="#FFFFFF" stroke="#C56A25" stroke-width="3"/><text x="542.5" y="287" text-anchor="middle" class="label">03 逐级上报</text><text x="542.5" y="320" text-anchor="middle" class="tiny" fill="#526173">按级报告</text><line x1="630" y1="301" x2="649" y2="301" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="655" y="245" width="175" height="112" rx="10" fill="#FFFFFF" stroke="#7657B8" stroke-width="3"/><text x="742.5" y="287" text-anchor="middle" class="label">04 责任调查</text><text x="742.5" y="320" text-anchor="middle" class="tiny" fill="#526173">事实 / 原因 / 证据</text><line x1="830" y1="301" x2="849" y2="301" stroke="#7657B8" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="855" y="245" width="175" height="112" rx="10" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3"/><text x="942.5" y="287" text-anchor="middle" class="label">05 整改</text><text x="942.5" y="320" text-anchor="middle" class="tiny" fill="#526173">措施 / 责任 / 记录</text><line x1="1030" y1="301" x2="1049" y2="301" stroke="#1C9C8C" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="1055" y="245" width="175" height="112" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="1142.5" y="287" text-anchor="middle" class="label">06 验证关闭</text><text x="1142.5" y="320" text-anchor="middle" class="tiny" fill="#526173">效果 / 防复发</text><path d="M1100 410 C1000 560,500 580,350 410" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/><text x="720" y="580" text-anchor="middle" class="small" fill="#D95C5C">未通过 / 复发：再调查或升级</text><rect x="100" y="150" width="1080" height="48" rx="8" fill="#FFF7DF" stroke="#E8D39A"/><text x="640" y="180" text-anchor="middle" class="label" fill="#A87519">响应级别、通知时限和责任岗位：待确认，以正式应急文件为准</text>
<line x1="52" y1="680" x2="1228" y2="680" stroke="#D7E0EA"/><text x="52" y="704" class="tiny" fill="#526173">鑫犇电子｜治理体系草案｜图形原型，待正式流程/授权文件确认</text><text x="1190" y="704" class="tiny" fill="#526173">DRAFT</text></svg>