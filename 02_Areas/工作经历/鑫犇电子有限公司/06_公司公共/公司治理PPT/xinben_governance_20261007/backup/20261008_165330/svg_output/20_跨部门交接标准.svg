<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6B7A90"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D95C5C"/></marker></defs>
<rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/>
<text x="60" y="62" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#1C9C8C">20 / GOVERNANCE · HANDOFF CONTROL</text>
<text x="60" y="108" font-family="Microsoft YaHei,Arial" font-size="38" font-weight="700" fill="#1F2D3D">跨部门交接标准</text>
<text x="60" y="140" font-family="Microsoft YaHei,Arial" font-size="17" fill="#526173">交接完成不是“发出去了”，而是输入完整、责任明确、输出可验证</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/>
<rect x="80" y="228" width="260" height="190" rx="18" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="2"/><text x="210" y="264" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#2F6BFF">交出方 · 输入包</text><text x="125" y="305" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1F2D3D">✓ 受控版本 / 图纸</text><text x="125" y="337" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1F2D3D">✓ 数量、状态、期限</text><text x="125" y="369" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1F2D3D">✓ 责任人与异常说明</text><text x="125" y="401" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1F2D3D">✓ 输出验收标准</text>
<path d="M340 323 H430" fill="none" stroke="#2F6BFF" stroke-width="4" marker-end="url(#a)"/><rect x="430" y="220" width="320" height="205" rx="18" fill="#FFFFFF" stroke="#C56A25" stroke-width="2"/><text x="590" y="258" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="19" font-weight="700" fill="#C56A25">完整性闸口</text><text x="480" y="300" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1F2D3D">01 资料齐全</text><text x="480" y="330" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1F2D3D">02 版本一致</text><text x="480" y="360" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1F2D3D">03 责任与期限明确</text><text x="480" y="390" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1F2D3D">04 接收标准可判断</text><rect x="520" y="400" width="140" height="28" rx="14" fill="#FFF7DF"/><text x="590" y="420" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" font-weight="700" fill="#A87519">确认后才放行</text>
<path d="M750 323 H840" fill="none" stroke="#1C9C8C" stroke-width="4" marker-end="url(#a)"/><rect x="840" y="228" width="300" height="190" rx="18" fill="#EAF7F4" stroke="#1C9C8C" stroke-width="2"/><text x="990" y="264" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#1C9C8C">接收方 · 验收包</text><text x="885" y="305" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1F2D3D">✓ 接收确认</text><text x="885" y="337" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1F2D3D">✓ 差异 / 缺项记录</text><text x="885" y="369" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1F2D3D">✓ 任务进入受控状态</text><text x="885" y="401" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1F2D3D">✓ 异常升级责任明确</text>
<path d="M590 425 V490 H210 V418" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)"/><text x="400" y="480" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="15" font-weight="700" fill="#D95C5C">缺项 / 版本不一致：退回交出方，不得直接进入下一部门</text>
<rect x="80" y="555" width="1060" height="66" rx="16" fill="#FFFFFF" stroke="#DCE4EE"/><text x="110" y="595" font-family="Microsoft YaHei,Arial" font-size="16" font-weight="700" fill="#526173">交接证据</text><rect x="250" y="574" width="190" height="30" rx="15" fill="#EAF0FF"/><text x="345" y="595" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#2F6BFF">交接清单 / 版本号</text><rect x="470" y="574" width="190" height="30" rx="15" fill="#EAF7F4"/><text x="565" y="595" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1C9C8C">接收确认 / 差异记录</text><rect x="690" y="574" width="190" height="30" rx="15" fill="#FFF2E7"/><text x="785" y="595" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#C56A25">责任人 / 截止日期</text><rect x="910" y="574" width="190" height="30" rx="15" fill="#FFF0F0"/><text x="1005" y="595" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#B84747">异常升级记录</text>
<text x="60" y="690" font-family="Microsoft YaHei,Arial" font-size="12" fill="#8A97A8">图例：蓝色＝输入　橙色＝完整性闸口　青绿色＝验收　红色虚线＝缺项退回</text></svg>