<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6B7A90"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D95C5C"/></marker></defs><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/><text x="60" y="62" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#1C9C8C">23 / GOVERNANCE · COMPETENCE &amp; AUTHORIZATION</text><text x="60" y="108" font-family="Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="700" fill="#1F2D3D">人员能力与岗位授权</text><text x="60" y="140" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526173">培训不等于授权：能力确认是权限打开前的闸门</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/><text x="90" y="225" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#7657B8">能力确认阶梯</text><path d="M110 510 H300 V450 H490 V390 H680 V330 H870" fill="none" stroke="#7657B8" stroke-width="5" marker-end="url(#a)"/><g id="group_23_人员能力与岗位授权_labels" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><rect x="100" y="475" width="170" height="62" rx="12" fill="#F2ECFF" stroke="#7657B8"/><text x="185" y="512" font-size="17" font-weight="700" fill="#7657B8">培训</text><rect x="290" y="415" width="170" height="62" rx="12" fill="#F2ECFF" stroke="#7657B8"/><text x="375" y="452" font-size="17" font-weight="700" fill="#7657B8">能力确认</text><rect x="480" y="355" width="170" height="62" rx="12" fill="#FFF2E7" stroke="#C56A25"/><text x="565" y="392" font-size="17" font-weight="700" fill="#C56A25">岗位授权</text><rect x="670" y="295" width="170" height="62" rx="12" fill="#EAF7F4" stroke="#1C9C8C"/><text x="755" y="332" font-size="17" font-weight="700" fill="#1C9C8C">授权记录</text></g><rect x="90" y="570" width="780" height="52" rx="26" fill="#FFFFFF" stroke="#DCE4EE"/><text x="480" y="602" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526173">每一级都要有证据：培训记录 · 评价结果 · 授权批准 · 复核日期</text><text x="930" y="225" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1C9C8C">授权生命周期</text><rect x="900" y="260" width="270" height="250" rx="18" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="2"/><path d="M1035 300 C1110 300 1140 350 1110 400 C1080 450 990 450 960 400 C930 350 960 300 1035 300Z" fill="none" stroke="#1C9C8C" stroke-width="4" marker-end="url(#a)"/><text x="1035" y="350" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#1C9C8C">维护与复核</text><text x="1035" y="390" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526173">复训 / 调岗 / 替代</text><text x="1035" y="430" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526173">失效时暂停</text><path d="M1035 510 V555 H700" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)"/><text x="1040" y="545" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#B84747">离岗 / 不合格：回收权限</text><rect x="90" y="260" width="270" height="110" rx="16" fill="#FFF7DF" stroke="#A87519" stroke-width="2"/><text x="225" y="300" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#A87519">能力闸门</text><text x="225" y="335" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526173">未确认能力 → 不得授权</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" fill="#8A97A8">紫色＝能力判断　橙色＝授权　青绿色＝有效维护　红色虚线＝暂停/回收</text></svg>