<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
 <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2F6BFF"/></marker>
 <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D95C5C"/></marker>
 <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1C9C8C"/></marker>
 <style>text{font-family:'Microsoft YaHei','Arial',sans-serif;fill:#1F2D3D}.title{font-size:30px;font-weight:700}.sub{font-size:14px;fill:#526173}.label{font-size:13px;font-weight:700}.small{font-size:12px}.tiny{font-size:11px}</style>
</defs><rect width="1280" height="720" fill="#F7F9FC"/>
<text x="52" y="48" class="title">16｜采购到付款</text><text x="52" y="75" class="sub">职责分离泳道：申请、下单、收货、对账和付款由不同责任主体承接</text>
<text x="52" y="118" class="small" fill="#526173">同一笔采购至少经过申请、采购、收货、对账/付款的相互核对</text><rect x="52" y="145" width="1176" height="78" rx="4" fill="#FFFFFF" stroke="#D7E0EA"/><rect x="52" y="145" width="142" height="78" rx="4" fill="#EAF0FF" stroke="#D7E0EA"/><text x="123.0" y="189" text-anchor="middle" class="label">需求部门</text><rect x="52" y="223" width="1176" height="78" rx="4" fill="#FFFFFF" stroke="#D7E0EA"/><rect x="52" y="223" width="142" height="78" rx="4" fill="#EAF7F4" stroke="#D7E0EA"/><text x="123.0" y="267" text-anchor="middle" class="label">采购 / 营运部</text><rect x="52" y="301" width="1176" height="78" rx="4" fill="#FFFFFF" stroke="#D7E0EA"/><rect x="52" y="301" width="142" height="78" rx="4" fill="#FFF7DF" stroke="#D7E0EA"/><text x="123.0" y="345" text-anchor="middle" class="label">仓储 / 收货</text><rect x="52" y="379" width="1176" height="78" rx="4" fill="#FFFFFF" stroke="#D7E0EA"/><rect x="52" y="379" width="142" height="78" rx="4" fill="#FFF2E7" stroke="#D7E0EA"/><text x="123.0" y="423" text-anchor="middle" class="label">财务 / 授权人</text><rect x="220" y="160" width="120" height="48" rx="8" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/><text x="280.0" y="180" text-anchor="middle" class="label">采购申请</text><text x="280.0" y="197" text-anchor="middle" class="tiny" fill="#526173">需求与规格</text><rect x="390" y="238" width="120" height="48" rx="8" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="2"/><text x="450.0" y="258" text-anchor="middle" class="label">询价 / 下单</text><text x="450.0" y="275" text-anchor="middle" class="tiny" fill="#526173">供应商与价格</text><rect x="560" y="316" width="120" height="48" rx="8" fill="#FFFFFF" stroke="#C56A25" stroke-width="2"/><text x="620.0" y="336" text-anchor="middle" class="label">收货 / 入库</text><text x="620.0" y="353" text-anchor="middle" class="tiny" fill="#526173">数量与状态</text><rect x="730" y="394" width="120" height="48" rx="8" fill="#FFFFFF" stroke="#7657B8" stroke-width="2"/><text x="790.0" y="414" text-anchor="middle" class="label">对账 / 付款</text><text x="790.0" y="431" text-anchor="middle" class="tiny" fill="#526173">授权与留痕</text><path d="M340 184 C364 184,366 262,390 262" fill="none" stroke="#2F6BFF" stroke-width="3" marker-end="url(#arrowBlue)"/><path d="M510 262 C534 262,536 340,560 340" fill="none" stroke="#1C9C8C" stroke-width="3" marker-end="url(#arrowBlue)"/><path d="M680 340 C704 340,706 418,730 418" fill="none" stroke="#C56A25" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="890" y="145" width="338" height="170" rx="8" fill="#FFFFFF" stroke="#D7E0EA"/><text x="915" y="175" class="label">三类相互核对资料</text><text x="915" y="205" class="small">申请 / 订单资料</text><text x="915" y="233" class="small">收货 / 入库资料</text><text x="915" y="261" class="small">发票 / 付款资料</text><text x="915" y="291" class="tiny" fill="#526173">不得由同一角色独立完成全链路</text><path d="M850 418 C820 520,600 570,410 520 C320 495,300 430,410 340" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/><text x="700" y="570" class="small" fill="#D95C5C" text-anchor="middle">数量 / 质量 / 价格不一致：暂停付款并退回核对</text><rect x="90" y="560" width="1080" height="54" rx="6" fill="#FFF7DF" stroke="#E8D39A"/><text x="630" y="585" text-anchor="middle" class="tiny" fill="#A87519">具体金额、审批层级、例外授权：待正式授权文件确认；本页仅表达职责分离原则。</text>
<line x1="52" y1="680" x2="1228" y2="680" stroke="#D7E0EA"/><text x="52" y="704" class="tiny" fill="#526173">鑫犇电子｜治理体系草案｜图形原型，待正式流程/授权文件确认</text><text x="1190" y="704" class="tiny" fill="#526173">DRAFT</text></svg>