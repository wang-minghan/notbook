<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/><text x="60" y="62" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#1C9C8C">08 / GOVERNANCE · INTERFACE MAP</text><text x="60" y="108" font-family="Microsoft YaHei,Arial" font-size="38" font-weight="700" fill="#1F2D3D">部门职责地图</text><text x="60" y="140" font-family="Microsoft YaHei,Arial" font-size="17" fill="#526173">以五个正式一级部门呈现关键输入、输出与协同接口；班组归属按受控组织矩阵</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/><rect x="60" y="190" width="218" height="342" rx="14" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/><text x="169" y="225" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#2F6BFF">生产部</text><line x1="78" y1="240" x2="260" y2="240" stroke="#D7E0EA"/><text x="76" y="275" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12" font-weight="400" fill="#526173">输入：订单评审、物料齐套、质量要求</text><text x="76" y="345" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12" font-weight="400" fill="#1F2D3D">输出：生产任务与产量/异常记录</text><text x="76" y="415" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12" font-weight="400" fill="#2F6BFF">接口：品质判定；营运交期协同</text><text x="76" y="483" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="10" font-weight="400" fill="#526173">工程技术组 / 冲压车间 / 模具维修组 / 清洗车间</text><rect x="294" y="190" width="218" height="342" rx="14" fill="#FFFFFF" stroke="#7657B8" stroke-width="2"/><text x="403" y="225" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#7657B8">品质部</text><line x1="312" y1="240" x2="494" y2="240" stroke="#D7E0EA"/><text x="310" y="275" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12" font-weight="400" fill="#526173">输入：来料、首件/制程、成品待检</text><text x="310" y=