<text x="52" y="48" class="title">26｜管理指标看板</text><text x="52" y="75" class="sub">用目标—实际—趋势—异常—决策组织经营指标，不以普通卡片代替看板</text>
<text x="52" y="116" class="small" fill="#526173">看板阅读顺序：目标/实际 → 趋势 → 异常风险 → 管理决策；数值与责任人待正式口径确认</text><rect x="52" y="150" width="350" height="148" rx="10" fill="#FFFFFF" stroke="#D7E0EA"/><rect x="52" y="150" width="350" height="10" rx="5" fill="#2F6BFF"/><text x="72" y="189" class="label">交付</text><text x="72" y="214" class="small" fill="#526173">OTD / 准时交付</text><text x="72" y="250" class="label" fill="#2F6BFF">待确认</text><text x="72" y="274" class="tiny" fill="#526173">目标｜实际｜趋势</text><polyline points="270,262 296,242 322,254 348,226 374,234" fill="none" stroke="#2F6BFF" stroke-width="3"/><line x1="262" y1="275" x2="382" y2="275" stroke="#D7E0EA"/><rect x="442" y="150" width="350" height="148" rx="10" fill="#FFFFFF" stroke="#D7E0EA"/><rect x="442" y="150" width="350" height="10" rx="5" fill="#7657B8"/><text x="462" y="189" class="label">质量</text><text x="462" y="214" class="small" fill="#526173">一次合格率</text><text x="462" y="250" class="label" fill="#7657B8">待确认</text><text x="462" y="274" class="tiny" fill="#526173">目标｜实际｜趋势</text><polyline points="660,262 686,242 712,254 738,226 764,234" fill="none" stroke="#7657B8" stroke-width="3"/><line x1="652" y1="275" x2="772" y2="275" stroke="#D7E0EA"/><rect x="832" y="150" width="350" height="148" rx="10" fill="#FFFFFF" stroke="#D7E0EA"/><rect x="832" y="150" width="350" height="10" rx="5" fill="#1C9C8C"/><text x="852" y="189" class="label">采购/库存</text><text x="852" y="214" class="small" fill="#526173">交期与库存覆盖</text><text x="852" y="250" class="label" fill="#1C9C8C">待确认</text><text x="852" y="274" class="tiny" fill="#526173">目标｜实际｜趋势</text><polyline points="1050,262 1076,242 1102,254 1128,226 1154,234" fill="none" stroke="#1C9C8C" stroke-width="3"/><line x1="1042" y1="275" x2="1162" y2="275" stroke="#D7E0EA"/><rect x="52" y="335" width="350" height="148" rx="10" fill="#FFFFFF" stroke="#D7E0EA"/><rect x="52" y="335" width="350" height="10" rx="5" fill="#C56A25"/><text x="72" y="374" class="label">现金/成本</text><text x="72" y="399" class="small" fill="#526173">采购成本 / 回款</text><text x="72" y="435" class="label" fill="#C56A25">待确认</text><text x="72" y="459" class="tiny" fill="#526173">目标｜实际｜趋势</text><polyline points="270,447 296,427 322,439 348,411 374,419" fill="none" stroke="#C56A25" stroke-width="3"/><line x1="262" y1="460" x2="382" y2="460" stroke="#D7E0EA"/><rect x="442" y="335" width="350" height="148" rx="10" fill="#FFFFFF" stroke="#D7E0EA"/><rect x="442" y="335" width="350" height="10" rx="5" fill="#2F6BFF"/><text x="462" y="374" class="label">能力</text><text x="462" y="399" class="small" fill="#526173">关键岗位覆盖率</text><text x="462" y="435" class="label" fill="#2F6BFF">待确认</text><text x="462" y="459" class="tiny" fill="#526173">目标｜实际｜趋势</text><polyline points="660,447 686,427 712,439 738,411 764,419" fill="none" stroke="#2F6BFF" stroke-width="3"/><line x1="652" y1="460" x2="772" y2="460" stroke="#D7E0EA"/><rect x="832" y="335" width="350" height="148" rx="10" fill="#FFFFFF" stroke="#D7E0EA"/><rect x="832" y="335" width="350" height="10" rx="5" fill="#D95C5C"/><text x="852" y="374" class="label">整改闭环</text><text x="852" y="399" class="small" fill="#526173">逾期与复发项</text><text x="852" y="435" class="label" fill="#D95C5C">待确认</text><text x="852" y="459" class="tiny" fill="#526173">目标｜实际｜趋势</text><polyline points="1050,447 1076,427 1102,439 1128,411 1154,419" fill="none" stroke="#D95C5C" stroke-width="3"/><line x1="1042" y1="460" x2="1162" y2="460" stroke="#D7E0EA"/><rect x="52" y="555" width="560" height="72" rx="8" fill="#FFF0F0" stroke="#D95C5C"/><text x="76" y="584" class="label" fill="#D95C5C">异常 / 需要关注</text><text x="76" y="608" class="small" fill="#526173">指标偏离目标、逾期或复发项：待确认后列入责任人和期限</text><rect x="640" y="555" width="588" height="72" rx="8" fill="#FFF7DF" stroke="#C56A25"/><text x="664" y="584" class="label" fill="#C56A25">管理层决策区</text><text x="664" y="608" class="small" fill="#526173">本周期需决策事项：资源、优先级、升级或目标调整（待确认）</text>
