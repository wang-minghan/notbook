<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8091A5"/></marker><filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#AAB7C6" flood-opacity=".24"/></filter></defs><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/>
<text x="60" y="62" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#1C9C8C">17 / QUALITY GOVERNANCE · DECISION FLOW</text><text x="60" y="108" font-family="Microsoft YaHei,Arial" font-size="38" font-weight="700" fill="#1F2D3D">质量异常与放行</text><text x="60" y="140" font-family="Microsoft YaHei,Arial" font-size="17" fill="#526173">先隔离和判断，再决定处置；交期压力不能替代质量授权</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/>
<path d="M170 300 H300 M440 300 H570 M710 300 H840 M980 300 H1110" stroke="#8091A5" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M640 360 V470 H390 V515 M920 360 V470 H1000 V515" stroke="#D95C5C" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#arr)"/>
<g filter="url(#sh)" id="obj_17_质量异常与放行_1"><rect x="80" y="260" width="180" height="82" rx="14" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="2"/><text x="170" y="295" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="20" font-weight="700" fill="#1F2D3D">发现异常</text><text x="170" y="321" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">现场 / 客诉 / 检验</text></g>
<g filter="url(#sh)" id="obj_17_质量异常与放行_2"><rect x="300" y="260" width="180" height="82" rx="14" fill="#EAF7F4" stroke="#1C9C8C" stroke-width="2"/><text x="390" y="295" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="20" font-weight="700" fill="#1F2D3D">隔离与标识</text><text x="390" y="321" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">防止误用、误发</text></g>
<g filter="url(#sh)" id="obj_17_质量异常与放行_3"><rect x="520" y="250" width="240" height="102" rx="14" fill="#F2ECFF" stroke="#7657B8" stroke-width="2"/><text x="640" y="286" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="20" font-weight="700" fill="#1F2D3D">专业判断</text><text x="640" y="313" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">确认影响范围、原因方向</text><path d="M620 338 l20 12 20-12" stroke="#7657B8" fill="none"/></g>
<g filter="url(#sh)" id="obj_17_质量异常与放行_4"><path d="M920 235 L990 300 L920 365 L850 300 Z" fill="#FFF7DF" stroke="#A87519" stroke-width="2"/><text x="920" y="296" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="17" font-weight="700" fill="#805B12">可否放行？</text><text x="920" y="318" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="12" fill="#A87519">依据受控标准</text></g>
<g filter="url(#sh)" id="obj_17_质量异常与放行_5"><rect x="1050" y="260" width="150" height="82" rx="14" fill="#EAF7F4" stroke="#1C9C8C" stroke-width="2"/><text x="1125" y="295" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="20" font-weight="700" fill="#1F2D3D">验证关闭</text><text x="1125" y="321" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#526173">记录结果与复发控制</text></g>
<rect x="230" y="500" width="320" height="70" rx="14" fill="#FFF0F0" stroke="#D95C5C" stroke-width="2"/><text x="390" y="530" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#B84747">否：继续隔离并升级</text><text x="390" y="553" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#B84747">形成异常单、风险和处置责任</text>
<rect x="820" y="500" width="360" height="70" rx="14" fill="#FFF0F0" stroke="#D95C5C" stroke-width="2"/><text x="1000" y="530" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#B84747">授权不清：不得自行放行</text><text x="1000" y="553" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#B84747">提交有权负责人确认（权限待公司确认）</text>
<rect x="100" y="620" width="1080" height="44" rx="22" fill="#FFFFFF" stroke="#D7E0EA"/><text x="640" y="648" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="15" font-weight="700" fill="#526173">证据：异常记录 · 隔离标识 · 判断依据 · 处置批准 · 验证结果 · 客户沟通（如适用）</text><text x="60" y="692" font-family="Microsoft YaHei,Arial" font-size="12" fill="#8A97A8">实线＝正常控制路径　虚线红线＝拒绝、隔离或升级　放行最终权限以正式授权文件为准</text></svg>