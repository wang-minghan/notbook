<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9FC" /><rect width="1280" height="8" fill="#2F6BFF" /><text x="60" y="68" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1C9C8C">30 / GOVERNANCE</text><text x="60" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="40" font-weight="bold" fill="#1F2D3D">不符合项与整改关闭</text><text x="60" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#526173">整改必须有原因、措施、期限、验证和复发控制</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA" /><g id="main-content" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><path fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3" d="M86,270 H224 A16,16 0 0 1 240,286 V369 A16,16 0 0 1 224,385 H86 A16,16 0 0 1 70,369 V286 A16,16 0 0 1 86,270 Z" /><text x="155" y="315" font-size="19" font-weight="bold" fill="#2F6BFF">01 发现登记</text><text x="155" y="347" font-size="14" fill="#526173">事实｜证据｜来源</text><path fill="#FFFFFF" stroke="#D95C5C" stroke-width="3" d="M286,270 H424 A16,16 0 0 1 440,286 V369 A16,16 0 0 1 424,385 H286 A16,16 0 0 1 270,369 V286 A16,16 0 0 1 286,270 Z" /><text x="355" y="315" font-size="19" font-weight="bold" fill="#B84747">02 分级升级</text><text x="355" y="347" font-size="14" fill="#526173">风险｜责任｜期限</text><path fill="#FFFFFF" stroke="#7657B8" stroke-width="3" d="M486,270 H624 A16,16 0 0 1 640,286 V369 A16,16 0 0 1 624,385 H486 A16,16 0 0 1 470,369 V286 A16,16 0 0 1 486,270 Z" /><text x="555" y="315" font-size="19" font-weight="bold" fill="#7657B8">03 原因分析</text><text x="555" y="347" font-size="14" fill="#526173">根因｜复发控制</text><path fill="#FFFFFF" stroke="#C56A25" stroke-width="3" d="M686,270 H824 A16,16 0 0 1 840,286 V369 A16,16 0 0 1 824,385 H686 A16,16 0 0 1 670,369 V286 A16,16 0 0 1 686,270 Z" /><text x="755" y="315" font-size="19" font-weight="bold" fill="#C56A25">04 制定措施</text><text x="755" y="347" font-size="14" fill="#526173">责任｜期限｜记录</text><path fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3" d="M886,270 H1024 A16,16 0 0 1 1040,286 V369 A16,16 0 0 1 1024,385 H886 A16,16 0 0 1 870,369 V286 A16,16 0 0 1 886,270 Z" /><text x="955" y="315" font-size="19" font-weight="bold" fill="#1C9C8C">05 效果验证</text><text x="955" y="347" font-size="14" fill="#526173">证据｜有效性</text><path fill="#FFFFFF" stroke="#1C9C8C" stroke-width="3" d="M1086,270 H1204 A16,16 0 0 1 1220,286 V369 A16,16 0 0 1 1204,385 H1086 A16,16 0 0 1 1070,369 V286 A16,16 0 0 1 1086,270 Z" /><text x="1145" y="315" font-size="19" font-weight="bold" fill="#1C9C8C">06 关闭</text><text x="1145" y="347" font-size="14" fill="#526173">批准｜留痕</text></g><path d="M240 327 H270 M440 327 H470 M640 327 H670 M840 327 H870 M1040 327 H1070" stroke="#8091A5" stroke-width="4" marker-end="url(#a)" /><path d="M1070 385 C1030 510 500 545 355 385" fill="none" stroke="#D95C5C" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#r)" /><text x="520" y="520" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#B84747">验证失败/逾期/复发：再升级，不直接关闭</text><text x="70" y="600" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#A87519">责任岗位、整改期限和关闭权限：待确认，以正式授权文件为准</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">鑫犇电子有限公司｜公司治理与管理方法</text><text x="1220" y="690" text-anchor="end" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#8190A0">30</text><defs><marker id="a" markerWidth="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8091A5" /></marker><marker id="r" markerWidth="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D95C5C" /></marker></defs></svg>