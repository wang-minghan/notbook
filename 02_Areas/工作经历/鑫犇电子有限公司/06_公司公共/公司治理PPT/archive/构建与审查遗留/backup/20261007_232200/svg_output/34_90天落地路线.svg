<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#9AA9BA"/></marker><filter id="f"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#AAB7C6" flood-opacity=".22"/></filter></defs><rect width="1280" height="720" fill="#F7F9FC"/><rect width="1280" height="8" fill="#2F6BFF"/>
<text x="60" y="62" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#1C9C8C">34 / IMPLEMENTATION ROADMAP</text><text x="60" y="108" font-family="Microsoft YaHei,Arial" font-size="38" font-weight="700" fill="#1F2D3D">90天落地路线</text><text x="60" y="140" font-family="Microsoft YaHei,Arial" font-size="17" fill="#526173">先跑通关键责任、授权和记录，再扩展到全公司</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA"/>
<line x1="150" y1="360" x2="1130" y2="360" stroke="#9AA9BA" stroke-width="5" marker-end="url(#m)"/><circle cx="190" cy="360" r="18" fill="#2F6BFF"/><circle cx="640" cy="360" r="18" fill="#1C9C8C"/><circle cx="1090" cy="360" r="18" fill="#C56A25"/>
<g filter="url(#f)"><rect x="80" y="205" width="330" height="230" rx="18" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/><rect x="80" y="205" width="330" height="12" rx="6" fill="#2F6BFF"/><text x="110" y="260" font-family="Microsoft YaHei,Arial" font-size="24" font-weight="700" fill="#2F6BFF">0—30天</text><text x="110" y="292" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#1F2D3D">确认主数据</text><text x="110" y="330" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 组织、岗位和授权人</text><text x="110" y="358" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 关键流程输入与输出</text><text x="110" y="386" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 记录、版本和待确认项</text><text x="110" y="415" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#2F6BFF">阶段门：责任基线确认</text></g>
<g filter="url(#f)"><rect x="475" y="205" width="330" height="230" rx="18" fill="#FFFFFF" stroke="#1C9C8C" stroke-width="2"/><rect x="475" y="205" width="330" height="12" rx="6" fill="#1C9C8C"/><text x="505" y="260" font-family="Microsoft YaHei,Arial" font-size="24" font-weight="700" fill="#1C9C8C">31—60天</text><text x="505" y="292" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#1F2D3D">关键流程试运行</text><text x="505" y="330" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 订单、变更、质量异常</text><text x="505" y="358" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 采购、交接和会议闭环</text><text x="505" y="386" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 记录样例与问题复盘</text><text x="505" y="415" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#1C9C8C">阶段门：试运行评审</text></g>
<g filter="url(#f)"><rect x="870" y="205" width="330" height="230" rx="18" fill="#FFFFFF" stroke="#C56A25" stroke-width="2"/><rect x="870" y="205" width="330" height="12" rx="6" fill="#C56A25"/><text x="900" y="260" font-family="Microsoft YaHei,Arial" font-size="24" font-weight="700" fill="#C56A25">61—90天</text><text x="900" y="292" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="700" fill="#1F2D3D">复盘与固化</text><text x="900" y="330" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 根据结果修订制度和表单</text><text x="900" y="358" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 明确培训、授权和检查机制</text><text x="900" y="386" font-family="Microsoft YaHei,Arial" font-size="15" fill="#526173">• 形成下一轮改进计划</text><text x="900" y="415" font-family="Microsoft YaHei,Arial" font-size="14" font-weight="700" fill="#C56A25">阶段门：正式发布前批准</text></g>
<rect x="170" y="525" width="940" height="58" rx="29" fill="#FFF7DF" stroke="#E8D39A"/><text x="640" y="561" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" font-weight="700" fill="#805B12">本路线是建议机制，不代表公司已经完成实施；每个阶段以实际确认、试运行记录和批准结果为准</text><text x="60" y="692" font-family="Microsoft YaHei,Arial" font-size="12" fill="#8A97A8">路线不是项目承诺书：责任人、日期、范围和验收标准须在公司确认后冻结</text></svg>