<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6B7A90" /></marker></defs><rect width="1280" height="720" fill="#F7F9FC" /><rect width="1280" height="8" fill="#2F6BFF" /><text x="60" y="62" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#1C9C8C">22 / GOVERNANCE · RECORD TRACEABILITY</text><text x="60" y="108" font-family="Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="700" fill="#1F2D3D">记录与档案生命周期</text><text x="60" y="140" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526173">记录要能形成、找到、看懂，并在到期时有依据地处置</text><line x1="60" y1="166" x2="1220" y2="166" stroke="#D7E0EA" /><text x="80" y="220" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#526173">形成 → 审核 → 编码归档 → 权限保存 → 检索借阅 → 到期处置</text><line x1="110" y1="285" x2="910" y2="285" stroke="#2F6BFF" stroke-width="5" marker-end="url(#a)" /><g id="group_22_记录与档案生命周期_labels" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><circle cx="130" cy="285" r="42" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="2" /><text x="130" y="291" font-size="16" font-weight="700" fill="#2F6BFF">形成</text><circle cx="290" cy="285" r="42" fill="#EAF7F4" stroke="#1C9C8C" stroke-width="2" /><text x="290" y="291" font-size="16" font-weight="700" fill="#1C9C8C">审核</text><circle cx="450" cy="285" r="42" fill="#FFFFFF" stroke="#7657B8" stroke-width="2" /><text x="450" y="291" font-size="16" font-weight="700" fill="#7657B8">归档</text><circle cx="610" cy="285" r="42" fill="#FFF2E7" stroke="#C56A25" stroke-width="2" /><text x="610" y="291" font-size="16" font-weight="700" fill="#C56A25">保存</text><circle cx="770" cy="285" r="42" fill="#EAF7F4" stroke="#1C9C8C" stroke-width="2" /><text x="770" y="291" font-size="16" font-weight="700" fill="#1C9C8C">检索</text><circle cx="930" cy="285" r="42" fill="#FFF7DF" stroke="#A87519" stroke-width="2" /><text x="930" y="291" font-size="16" font-weight="700" fill="#A87519">处置</text></g><path d="M450 330 V410 H1050" fill="none" stroke="#7657B8" stroke-width="3" marker-end="url(#a)" /><path fill="#FFFFFF" stroke="#D7E0EA" d="M116,385 H334 A16,16 0 0 1 350,401 V489 A16,16 0 0 1 334,505 H116 A16,16 0 0 1 100,489 V401 A16,16 0 0 1 116,385 Z" /><text x="225" y="420" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#7657B8">档案分层</text><text x="130" y="450" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#526173">普通记录 · 受限记录</text><text x="130" y="476" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#526173">关键经营 / 质量记录</text><path fill="#FFF2E7" stroke="#C56A25" d="M416,385 H634 A16,16 0 0 1 650,401 V489 A16,16 0 0 1 634,505 H416 A16,16 0 0 1 400,489 V401 A16,16 0 0 1 416,385 Z" /><text x="525" y="420" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#C56A25">权限与留痕</text><text x="430" y="450" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#526173">谁可看 · 谁借阅</text><text x="430" y="476" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#526173">访问记录 · 归还记录</text><path fill="#FFF7DF" stroke="#A87519" d="M716,385 H934 A16,16 0 0 1 950,401 V489 A16,16 0 0 1 934,505 H716 A16,16 0 0 1 700,489 V401 A16,16 0 0 1 716,385 Z" /><text x="825" y="420" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#A87519">到期决策</text><text x="730" y="450" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#526173">保留 / 延期 / 销毁</text><text x="730" y="476" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#526173">审批依据 · 处置留痕</text><path fill="#FFFFFF" stroke="#1C9C8C" stroke-width="2" d="M998,210 H1172 A18,18 0 0 1 1190,228 V382 A18,18 0 0 1 1172,400 H998 A18,18 0 0 1 980,382 V228 A18,18 0 0 1 998,210 Z" /><text x="1085" y="250" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1C9C8C">可追溯标准</text><text x="1020" y="290" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#1F2D3D">✓ 有唯一标识</text><text x="1020" y="325" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#1F2D3D">✓ 找得到原记录</text><text x="1020" y="360" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#1F2D3D">✓ 看得到访问痕迹</text><text x="1020" y="395" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#1F2D3D">✓ 处置有批准</text><text x="60" y="690" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" fill="#8A97A8">主线＝记录时间轴　下方＝档案分层与权限控制　处置必须保留决策证据</text></svg>